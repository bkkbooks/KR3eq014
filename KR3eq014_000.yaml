body:
  text: 袁序莫枚士研經言一書余從丹徒楊霽青先生抄得者也全書四卷凡一百五十餘篇多釋經辨誤之作實有發前人所未發者陸九芝陸心源二家序中已詳言之余諷誦再四覺此公之學養卻優不獨其疏證經義獨具卓識即其評論近世名醫如謂葉天士臨證指南於溫熱脾胃最精等處皆極平允之論以視黃坤載陳修園輩之一味泥古抹煞先賢者其相去為何如耶迹其生時適當洪楊割據天下大亂之時故雖經鏤版而所傳未廣余曩讀世補齋醫書即知有先生此書而四方尋覓竟未得見後承霽青先生賜覽因得録一副本私心欲廣其傳以公同好故於醫學扶輪報神州醫藥學報中皆擇尤刊布誠以維持絶學非廣為流布不以收效今年春紹興醫藥學報社擬刊醫學叢書以存國粹貽書相囑欲將此書刻入叢書中因即將所録副本郵寄付刊夫表彰前哲刊刻遺書耗為吾儕醫家之責不足深論獨是莫氏作此書時即當洪楊割據天下大亂之時而今日貴社刻此書時又值天下大亂禍至無日之候豈天心不仁降此鞠凶即塗炭其人民復肆虐於醫籍耶抑劫運有常洪楊距今已六十年前造此因今日應有此果耶然而風雨如晦雞鳴不已貴社諸君子之用心亦良苦矣丙辰首夏江都袁焯記於京口陸序余壻沈子彥模初自吳興來謁即盛稱其師莫枚士先生之醫學余即以拙著世補齋初稿介沈子正於先生而先生亦郵寄所撰研經言屬校並索為序既卒讀乃嘆先生之學之博識之邃深造自得而左右逢原者有如此也夫本經靈素刊之三墳既非蓬心人所能領會而如南陽一脈以及脈經病源千金外臺之所言則皆隨時隨地習見之病而亦視為鳥篆蟲書不可測識曾不能用其一方一藥尚何醫之足云哉君舉於鄉不樂仕進潛心小學出其餘緒以治醫家言為之審聲音詳訓詁以經解經復以方求病遂乃病無遁狀方無虛設如君之學若漫譽以高出時輩則是誣君而已豈知君者君所著尚有數種應請先以此册付手民俾今而後之病人得遇識字之醫而免夭札也里居戢影韓陵片石外無可語者行將鼓棹遊苕霅間登君之堂以所學相質證然亦勿勿耳沈子何幸而得立雪君門也是為序光緒五年己卯三月元和陸懋修拜撰按先生於甲申四月刊世補齋醫書文十六卷中於此序多所增改今謹録其初稿陸序豫少與同里莫枚士同治訓詁之學既遭多故余以軍事馳驅南北與枚士不相聞者數年及余奉諱歸握手道故則其氣益穆其學益邃且有不為良相為良醫之志其言醫也本小學以讀靈素祧宋元而禰漢唐與論學之旨同余初驚詫其言而卒無以易也未幾出所著研經言屬余為序夫先秦古書存於今寡矣幸而僅存又多詰屈奧衍魯魚亥豕非好學深思不能讀而醫書為尤甚蓋近古多聞綴學之士未必通醫家言醫家者流往往不識字不讀書而以醫為市即有一二名家或究心方劑而昧於微言或各執己見而疏於考古無惑乎醫家之不明而世人之多夭札也枚士憂之據説文以釋疝㿗之殊據玉篇以明癲癇之異而前人之失正焉邪哭則證之巢氏症即風癡酸削則證之周禮定為酸消而舊注之疏焉蛟龍乃龍咬之訛蛔咬有例柔痓實惡寒之症元本足徵而傳刻之訛祛焉洵乎仲景之功臣而俗醫之針砭矣他日推其所學以治天下所造豈可量哉獨念豫妄談經濟無裨於世及退而著書亦無成就讀枚士書不能無愧於心也同治十年七月愚弟陸心源拜撰自序余於咸豐之季避寇海上時疫盛行流民踵喪盡無以救始知醫之急於人也而學之既有年乃輯衆説考文析義校注傷寒論金匱方論二書繼以金匱論略因集衆症釋名狀立義例作證原及脈法繼又以治病在處方因闡經方作釋例繼又以處方在辨藥因校注神農本草經此外解經之作隨成隨棄録其存者得百餘首釐為四卷名曰研經言質之通人以為他日自鏡之資余不敏凡所論述不敢故為高深獨標新異惟務切近平實求當乎古人之書之義理而已記不云乎致知在格物書亦物也讀而格之以致其知將為診治地也如曰有裨斯藝以俟能者苕川迂叟自序
