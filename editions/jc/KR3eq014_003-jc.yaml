body:
  text: 卷三伏沖解說文沖通道也玉篇沖交道也脈以沖名者取經隧四達表裡交通之義此脈並陽明之經行身前者應孔穴其不應孔穴者並足少陰之經伏行背膂之下始稱伏沖亦曰伏膂名異實同惟其伏行故得交通前後為四達之路經敘虛邪中人之次不直言衝脈必別言伏沖者以傳邪未到伏沖之先由孫而絡而經而輸其入淺其途一一到伏沖則入較深而途不一或由腸胃之腠而傳二腑或由腸胃之外而傳膜原路路可走防禦綦難為泄為積未可預卜經意當以兩歧言不以遞進言否則既入腸胃豈有復出而傳膜原之理哉腸胃之外膜原之間所部甚廣自鬲肓至脖胦跨有臍之四旁於古尺約尺許其止者為積其行者為繞臍痛其不內逼於膜而傳者尚有腸胃之後膂筋一次其內逼膜原而傳者亦尚有小腸膜原之間一次其由支絡而傳者尚有衝脈之正經為臍上喘動應手之症益信此一脈之四達交通矣衝脈之外行者但稱沖則其伏行者稱伏沖理固宜然楊注太素不誤王注瘧論以為腎絡之伏行膂筋者蓋謂衝脈本腎絡之一也核之上文入脊內下文出缺盆之路甚合中風傷寒解傷寒論於傷寒外稱中風各詳其脈證於六經篇病源謂之中風傷寒其論即取論中六經脈證千金外臺相承皆如此泉案金匱有中風篇仲景不以此病同列於彼者以此與傷寒相似與痹歷節等不相似故也巢氏以傷寒稱之最得其旨蓋冬時疾風及非時寒風其來無漸非關觸冒故云中又以其彼來而我始冒之故云中又可云傷又以此風起毫毛髮腠理入襲於衛而自汗不能循經而傳故論文特起傳經例於傷寒條後而中風條不之及欲知傳經與否之義但取傷寒論營行脈中衛行脈外及風則傷衛寒則傷營數語繹之自明勿為近世所惑也秋傷於濕解凡論四氣當分二例自春分至秋分皆為暑自秋分至立春皆為寒二氣極偏皆從風傷於人經以暑配夏寒配冬者據其極偏之氣配以極偏之時也春之溫和秋之涼和本無所偏介乎寒暑往來之間而不可以寒暑言故於春言風以溫非邪風則為邪又以此風不偏勝故但言傷於風不別言寒者非謂風止於春傷人也於秋言濕者秋承中土之後本氣既無可言即以中土之濕配之秋謂秋分以前若秋分後天氣已寒此時傷之則從傷寒法經意以四氣分配四時言自難齊當以意逆實當如傷寒例從秋分後皆為傷寒也秋以土氣為氣者正如草木黃落以土色為色之比近喻嘉言欲改濕字為燥非是不觀靈九宮八風又以濕配東乎喻又將何以改之傷寒論六經解一傷寒所列六經與素熱病論不同熱病論依氣行之脈絡言故所著症與靈經脈篇義合傷寒論依邪入之次序言故所著症與靈經脈篇義不合經脈三陽經皆有頭痛陽明始有惡寒而仲景乃皆入之太陽更以胃實為正陽明經脈嗜臥屬足太陰而仲景乃謂少陰病欲寐經脈渴而欲飲飢不能食屬足少陰而仲景乃謂厥陰病消渴飲不欲食種種皆殊惟少陽太陰為近之而亦有殊者經脈目䀮䀮屬足少陰而仲景少陽目眩經脈飧泄屬足厥陰而仲景三陰俱列所以然者經但以陰陽分表裡兩層而以身之前後兩側分為三陰三陽仲景不但分表裡兩層且分表之表為太陽表之裡為少陽里之表為太陰里之裡為少陰里之至里為厥陰其腑為陽明義取遞進不取平按故僅列熱病論六經症於傷寒例而不即引之以冠六經篇首別自為說以著其名同實異也所以實異而名仍同者以太陽等六者乃古今紀陰陽者之大名六元以紀天之六氣難經以紀歲之六節脈經卷五扁鵲法以紀一日之六候卷十手撿圖以紀診法之六部經筋以紀筋皮部以紀絡若經脈則以紀榮衛而仲景因以紀表裡其義一也欲窮傷寒六經症者勿纏合靈素以亂之傷寒論六經解二傷寒一書專明表裡以寒邪之入也表裡以次故分六經以列其次之後先寒病之呈也表裡恆兼故又分六經六篇以辨其兼之多少於是屬詞比事不得不起一例其例純表者入表部兼里者亦入表部必純里者乃在裡部假如六經症具必在太陽篇以太陽為表之表也太陽症罷乃入陽明陽明罷乃入少陽少陽罷乃入太陰入少陰入厥陰各取最外一層隸之故於太陽著論最多而厥陰獨少非略也他經之兼太陽者例不得入於他經而厥陰之兼他經而已分入各部者例不得入於厥陰則第紀其經症及解時愈候而已其自諸四逆以下古另為一篇玉函題曰平嘔噦厥利脈症並治成本誤並之或據成本而猶以為少不得其故乃曰此仲景未成之書也否則曰此王叔和之所亂也傷寒論六經解三餘論傷寒六經為紀表裡屢矣究何所證曰證諸華佗千金引其說云凡傷寒一日在皮二日在膚三日在肌四日在胸五日在腹六日入胃是分六層以紀表裡之次者由佗始所云入胃即陽明病胃家實也在皮在膚在肌即太陽及陽明經病也在胸即少陽及太陰病吐食不下也在腹即太陰腹滿痛及少陰厥陰病也特措詞有文質分次有贏縮以此不同耳其紀表裡之義則同仲景既存素問六日六經之文於例而又取華氏六日六層之義潤飾之而易其目以著篇乃主藥法而略針法之意巢元方能知之故病源存華說於總論復次素問六日六經依脈生病之文於後與仲景若合符節是又得一證矣夫又奚疑傷寒論六經解四前論分次有縮又有一證蓋六經雖六核之止四華佗一日二日三日在膚皮肌仲景以太陽統之四日在胸以少陽統之六日在胃以陽明統之五日在腹仲景分為太陰少陰厥陰三經是華佗仲景雖各分為六恰各合為四耳故仲景著各經欲解是太陽巳午未陽明申酉戌少陽寅卯辰三陰則以亥子丑三時前後兼一時而錯互之其實於十二時中止得三時焉與靈衛氣行水下一刻人氣在太陽二刻少陽三刻陽明四刻陰分大同陰分即三陰之分也陰陽贏縮之義殆本此乎又仲景書中三陽中風皆各有證獨至三陰則太陰有四肢煩疼一證而少陰厥陰皆止言脈不言證明太陰篇一言可賅二經故二經篇從省也由中風推傷寒則太陰篇首所謂腹滿吐食者恐亦賅二經言第兼欲寐為少陰兼渴熱疼飢為厥陰皆當以滿吐為本不然僅僅欲寐豈足定為傷寒少陰病乎且少陰篇詳言吐利腹痛若以陽明少陽篇不詳太陽證例之不大相徑庭乎且三陽篇詳言傳經又言並病合病之證獨於三陰則從略而無太陰與少陰並病合病太陰與厥陰並病合病之證更無三陰合病二陰並病之證豈不昭然乎哉陽明病胃家實解邪之中人各有法度在軀則風中皮腠濕流關節寒傷筋骨熱傷血脈在臟則風傷肝濕傷腎寒傷肺熱傷心二者皆以類從若邪之不以類從者則必其表裡相傳者也大法在軀者以六經傳至七日愈在臟者以五臟傳至六日愈六經為陽五臟為陰也其表裡互傳不在此例故仲景書於惡寒則以發熱無熱起例於太陽篇而於通書中則本華佗六日六層之說而文之以六經之名殆混經臟而橫斜截之自成一家言故至陽明篇獨以胃家實為正而姑存陽明外證以備義其篇中冠以陽明病三字者皆指胃家實與素靈所稱陽明為行身前之脈者不同所以然者藥法與針法異也讀仲景書勿執他經以疑此論亦勿執此論以疑他經可已經於他篇之首各舉病名獨胃家實三字渾含之者以見胃象萬物所歸無所復傳其部既廣不可單稱一二故也細讀之自知千金作胃家寒者寒即塞字之誤與實同義金匱黃疸陰被其寒千金亦作塞可證奈何有見一寒字之異從而為之辭者腸覃解靈水脹篇腸覃者寒氣客於腸外與衛氣相搏氣不得榮因有所繫癖而內著惡氣乃起息肉內生其始生也大如雞子稍以益大至其成如懷子之狀久者離歲按之則堅推之則移月事以時下此其候也泉案腸覃既生息肉則有形矣但覃乃延長之義於病狀何取當為蕈之省文韻篇並云蕈之荏反地上菌也病之蕈名者蓋取腸外息肉生如蕈狀後世咽菌陰菌等名准此讀當尋上聲不當如字讀古蕈蕈二字多相通故五經文字云詩葛覃字亦作蕈但彼蕈仍當訓延而此蕈則當訓菌二字之詁雖異二字之通則同此類甚多不可不正蠱怚解靈熱病男子如蠱女子如怚身體腰脊如解不欲飲食楊注太素以為男女相悅之病女惑男為蠱男惑女為怚泉案楊說蓋據左傳而對參得之於名義最合今為引申之蠱者壞也素生氣通天注謂煎厥由房勞來而至耳目潰潰乎若壞都正以女惑男而壞也怚者阻也史記倉公傳韓女欲男子不可得病寒熱月不下正以男惑女而阻也曰煎厥曰寒熱則身必發熱故經列於熱病此熱必發於腎腎熱則侮脾故身體腰脊如解不欲飲食腎中之熱既淫於脾則必脾腎同治故下文云刺湧泉及跗上經文莫著於此由刺法推藥法其方可知千金無比山藥丸可以治蠱本事方抑陰煎可以治怚若更中於虛邪必皆致羸瘦咳嗽沉默殗殜為風虛勞傳屍勞等症當各隨宜治之矣或據玉篇怚驕也廣韻怚憍也而通怚於狙釋為詐病亦得蓋此症變幻不的知所苦朝涼即如平人暮熱輒至大劇有似詐也然以狙虛擬其神不若以阻實徵諸病千金直作阻字阻者經阻邪解楊注太素概釋邪字為虛邪最合經旨經謂風雨寒暑不能獨傷人必因於天之虛邪與其人虛兩虛相得乃客其形於此知外來之病無不挾有虛邪故兩經動輒言邪此邪字對太一之正風言也難經始目一切病人之氣為邪如心邪肝邪等臟腑之邪及飲食之邪云云不必皆是虛邪殆以邪字對人身之正氣言也仲景因之有大邪小邪清邪濁邪谷飪之邪諸稱皆用難經而引申其云邪哭者又將虛邪之氣名虛邪之病是以邪字對他病之正狀言也巢源因之而有五邪之名千金外臺又皆衍為驚邪之名皆由金匱而引申千金又有邪思泄痢症則又以邪字對心術之正用言也大抵名稱隨時而改讀者通其意勿泥其文否則必執今疑古而謂古方不可治今病矣邪哭解金匱五臟風寒篇有邪哭二字自來注家皆謂非哭之正狀如有聲無淚或哭而不悲之比是以邪為反正泛稱也然於本文血氣少之原不協惟巢氏病源中風門有驚邪狂癲四症相類而皆冠之以風是古固有以一邪字為病名者巢氏必本經說邪哭云者謂得邪病而哭病源所謂邪之為狀悲喜無度是也義本直截無俟深求且其病原於風則於血氣少三字允協風勝則燥理固然矣考古之邪即今之癡凡外臺千金治風邪諸方皆可治癡昧者以癲為癡而別於癇癲癡強合癲癇強分皆於古訓相背詳泉所撰金匱方論注及證原中酸削解金匱勞篇男子勞之為病其脈浮大手足煩熱春夏劇秋冬差陰寒精自出酸削不能行泉案酸削當為酸消謂酸嘶消沮也髓藏於頭而會絕骨絕骨穴在脛外廉故腦髓少者則頭痛而脛不能行其至春夏劇者以春氣病在頭故也周禮疾醫春時有痟首疾鄭注痟酸削也首疾頭疾也彼削亦當作消所以疊痟也說文痟酸痟頭痛也周禮曰春時有痟首疾此與鄭同義鄭注是分釋痟首疾三字之義非分三字為二症名說文酸痟頭痛也五字句是渾括其狀賈疏頭痛之外別有酸削之疾云云蓋誤會鄭意蜀都賦味蠲癘痟注痟頭痛也是誤會許意余目驗春溫症及春月傷風而病頭痛者無不脛酸周禮痟首疾三字真善狀病態者許鄭由頭言之仲景由脛言之各以其次為異耳下利解古書多言下利下即泄字利言其快加疒旁即為痢字下利與吐利文同吐利為快吐則下利即為快泄已兩經或稱其甚者為洞泄又為腸澼王注謂腸門開闢知本作闢讀為闢其病即下利也所云腸澼下白沫即今之白積腸澼下膿血即今之紅白積腸澼下血即今之赤痢腸紅等近世分下為泄瀉利為痢疾於是今之痢異於古之利矣豈知今之痢即難經五泄中之大瘕泄難經與餘四泄同稱泄是古之下賅今之痢仲景書亦止加下重二字以別之不另立一名隋唐時或稱滯下或稱重下皆不脫下字存古義也徐氏軌範泛指腸澼為腸紅而以難經五泄概入泄仲景下利概入痢於此嘆論古之難病遇節發解古書言病之遇節即發也僅見於巢源屍注候而目見甚多有發於交節日者有發於交節前後數日者不必盡是屍注總之病根不拔則愈而復發其必遇節何也考萬物應節而來者莫如八風以風為中央土氣本尚書洪範鄭注詳前原風濕土於五常主信故至期而不爽而經謂風者百病之長是知遇節即發之病必風也風留經脈則隨感而作且五日為候三候為氣一氣者月郭盈虧之大法人身惟經脈隨月郭之盈虧以為盛衰故必久風之在經脈中者方為遇節即發若病不在經脈中雖屬久風亦不至遇節即發也故遇節即發之狀於風虛勞獨多陰脈陽脈解前論陽脈候先受陰脈候後受者其義本之叔微叔微於濕溫之脈陽濡而弱陰小而急則云先受溫後受濕以彼准此義當如是並以知溫脈濡弱也經意謂邪中於人其兼及表裡者當陰陽如一如溫瘧是若先受某邪後又受某邪則先之兼見於陰者必退而並於陽斯後之獨見於陰者乃得而乘於陽風溫溫毒溫疫脈法皆如是後者之不得陷於陽也以陽有宿邪也先者之不得越於陰也以陰有新邪也新者欲下不得下宿者欲上不得上不得下而因汗之則宿者隨新者以俱升而病劇不得上而因下之則新者隨宿者以深入而病變此二變者皆難治必明於溫熱之脈法而後溫病可診也亦必明於溫病之診法而後溫病可治也所以溫病大法禁汗下偏行之治而宜汗下並行之治萎蕤湯汗下並行之方也由萎蕤而推之他方思過半矣晚發解平脈法脈陰陽俱緊至於吐利其脈獨不解若脈遲至六七日不欲食此為晚發水停故也為未解成注晚發者後來之疾也泉案外臺卷一張文仲療晚發傷寒三月至年末為晚發方生地梔子升麻柴胡石膏五味若頭面赤去石膏用乾葛無地用豉然則晚發云者乃傷寒最晚所發以意逆之感寒熱而至半年發者曰晚發三月晚發者其感在冬至前不論時氣正氣也年末晚發者其感在夏至後不論時氣正氣也以寒熱在身蓄至半年必發也何以言之自秋分至春分正氣之寒當以冬至為界冬至前傷寒者其晚發至三月末而極以距秋約半年也若冬至後傷寒至五月後發則為病熱不稱晚發為其兼新感也凡寒熱至二至後而木偏最易有新感有新感則病兩歧故不得稱晚發自春分至秋分時氣之寒當以夏至為界夏至前傷寒至九月發則為溫瘧不稱晚發為其兼新感也若夏至後傷寒至年末發者則為晚發以相距半年也自秋分至春分時氣之熱以冬至為界冬至前感熱者其晚發在三月末法與正氣同若冬至後感熱者至夏末發則為溫熱不稱晚發法與正氣同自春分至秋分正氣之熱亦以夏至為界夏至前感熱者至九月發則為溫瘧不稱晚發法與正氣同若夏至後感熱至年末發則為晚發法與正氣同然則晚發云者是從溫熱兩病中別出言之亦對時氣正氣之即發者言之蓋冬至後感之年末發與夏至前感之六月發皆即發也即字與晚字正相對若專以冬月正氣言之恐未能遲至次年末始發也活人書因此改為三月至夏殆未達其旨所以如是晚者以積受寒邪寒搏於液液停為水邪不得發故也凡邪伏不發者多由水停外臺卷四溫病冬溫未即發至春被積寒所折不得發至夏得熱其春寒解冬溫毒始發出肌中斑爛隱軫如錦文壯熱咳悶嘔吐清水據此知冬溫被春寒折時先有水停故至夏發時必嘔吐出水而後疹見此冬至後感時氣發於夏末者不稱晚發之證彼方用麻杏葛橘與此方皆是提出寒水之意又錄驗載溫毒此條下又云已自得下利宜服黃連橘皮湯然則停水之毒吐利皆有與晚發同法即謂外臺錄驗兩溫毒為晚發之溫也亦無不可鼠瘻解靈素本草皆屢言鼠瘻說者皆以食鼠殘成瘻者當之病源列九瘻中有鼠瘻引靈寒熱赤脈貫瞳於其下但病源鼠瘻既為九瘻之一則不得以概諸瘻可知三經鼠瘻鼠當為竄鼠性善竄故竄字從鼠鼠字即通竄詩正月鼠憂以癢小旻鼠思泣血兩字皆為竄義蓋遭亂之人多方求脫而卒不可得故既言鼠而復綴以憂思二字瘻之稱鼠亦取竄通經絡為義竄俗作串瘻與癧為雙聲故近世瘍科書皆呼癧串癧患即竄瘻之倒言也鼠如字讀則與注為聲轉瘻與流為聲同故近世瘍科書或呼流注流注即鼠瘻之倒言也凡取兩字相切成義者可順可倒如丁東東丁歷六陸離之類甚多鼠瘻之為癧串流注斷無疑已又此病初起曰瘰癧從其外命之已成曰鼠瘻從其內命之經稱寒熱瘰癧及寒熱鼠瘻別之以此因知赤脈貫瞳當是已成之癧串診法非初起之瘰癧診法何以言之經以赤脈多則死期遠少則近則見赤脈非凶兆明矣大抵血虛之人目皮裡面必白血主脈故以脈見之多少驗血虛之微甚瘰癧初起當不至是必已成癧串膿水淋漓已久合用此診法耳玉篇癙病也瘻瘡也衄有太陽陽明證解金匱衄云從春至夏衄者太陽從秋至冬衄者陽明獨不言少陽或據靈樞經脈謂少陽脈不至鼻似也而實非也蓋仲景所云太陽陽明者非謂太陽陽明之經乃其自分之部也太陽統三陽之表陽明為胃腑之裡衄有由陽絡之陽傷而得者外感風熱所致春夏從開邪必著於表故云從春至夏衄者太陽衄有由陽絡之陰傷而得者內傷飲食之熱覆被風鑠所致秋冬主闔邪必著於裡故云從秋至冬衄者陽明此文正與泉前三陰三陽諸篇相證雖似本之靈樞而要各自成論偶與之合也女勞疸日晡惡寒解凡黃家日晡多發熱者以陽明旺時也晡說文作餔云日加申時食也仲景云陽明旺申酉戌時疸熱隨之而發故以此為黃疸之常以其病在中上而下無病則散而不至逆也凡氣在中則可上可下在上必陷在下必逆若女勞疸熱固結於下不得下泄則時時上逆特與脾近與肺遠止得逆乘於中不能逆乘於上至日晡則中實脾旺疸熱之逆乘於中者得以乘勢逆乘於上上至肺而極故以肺虛惡寒之例而為此病惡寒仍肺病非腎病辨症之訣如此其額上黑之義同蓋女勞疸之熱之逆行於臟者借逕於脾胃而及肺其逆行於經者借逕於大腹而及額上額上為心之部腎病者顴與顏黑此之謂也此義三十年來屢思不得至癸巳夏偶得之隱指解脈經第一篇釋脈名兩言隱指嘗以問之老醫舉無應者及歷症有年始知其的蓋隱者揚之反經文皆於按之下言隱指者謂脈氣之鼓被指按住則不能發揚似乎隱匿故曰隱指其獨系之虛實二脈何也實脈初持時止見長大不得謂之實及按之而長象不減又不得發揚則其氣橫充指下而見滿象始成實脈矣故曰隱指愊愊然廣雅愊滿也是也虛脈初持時止見軟大不得謂之虛及按之而大象不減又不得發揚則其氣旁流指下而見芤象始成為虛脈矣故曰隱指豁豁然空玉篇豁空也是也虛實二脈之真際皆待按之而見故惟此二脈言隱指古人立言之妙非淺學所能領會矣陰陽附解脈經所謂陽附陰陰附陽者陰陽謂表裡附謂薄也陽附陰即表邪內陷之謂陰附陽即里邪外乘之謂病發於太陽則內薄發於少陰則外薄薄而不已必爭其與交並之別交者表裡不分清附者表多即里少里多即表少也並者表並於里即無表里並於表即無里附者里猶帶表表猶帶里也至於爭則薄者將勝矣將勝者盡入其境也表盡入里則陷故死里盡入表則出故生陰主闔陽加之則不能容故脹滿陽主開陰加之則虛者泄故汗出而其與並有別者並者已汗出附而爭者未汗出也可見診熱病總以汗出為佳也又案此時脹滿必不大便下之則其死尤速此時汗之必昏運補之則其愈遲補甚亦死一先一後之間必列此數名其丁寧示人之意切矣脈經歷集古今眾論其名稱或隨時代而異故多有詞異旨同者此謂薄為附亦其一端也溫病脈法解凡脈來盛去微如人喘狀者是邪氣由表薄里之象若又動數不均則薄里尤急即初大漸小之厥脈也傷寒得之為惡寒甚而熱多者以此今病過數日不見此二脈知其邪將衰不能薄里不薄里必還表將汗之兆也然亦有不薄里又不還表逗留半表裡間而脈如是者則象其肺臟之有所載也肺在軀殼內四臟上正在半表裡之次邪著於此則脈緩故去來平初終勻其人當喑喑者肺載邪而氣實無聲也欲邪之散仍須從汗出設汗之不汗則邪著固而肺將爛若萎矣法在不治脈經卷七熱病肺不喘三條義實如此凡云不者皆昨然今否之詞府謂胸中藏謂胃部陰陽謂表裡凡云期者皆施治冀望之詞三日四日者自七日後數之也七加四為十一日邪氣還表行其經竟之時至是不汗則其終不還表而著肺之固可知治法乃窮矣軟弱有石解素問平人氣象長夏軟弱有石曰冬病石甚曰今病從脈經及甲乙案石之義似當為堅而經與軟弱並舉則石脈之象從此可推已蓋堅為長屬去來相引石為短屬去來皆斷兩者固別素玉機真臟真腎脈至搏而絕如以指彈石辟辟然絕謂去來絕也一曰如奪索奪古脫字見說文奪索即絕也是石脈取義於絕不取于堅故得與軟弱並舉第辟辟之石無胃氣軟弱之石有胃氣故在彼為死脈在此為病脈耳所以長夏忌石者脾平脈相離如雞踐地則離而不甚覺其離也石則離之顯焉者矣夫離之為言猶斷也以不甚覺離者而忽顯見為離脾氣弱而腎氣強矣故病玉屏風散方義解玉屏風之止汗非如圬者之於牆然也其謂汗之因風得之者恆至虛其衛氣而久戀衛則不收風戀則不純以不純乘不收則汗出自易故必以防風從外發之白朮從中守之而黃耆則居其間而托之耆之為言致也詩皇矣上帝耆之耆致也推致衛氣使風不得留則衛自收而汗自止方義如此人見其汗止也而以為黃耆固表亦盍觀其方下有治風邪久留不散自汗不止兩語乎本草經曰黃耆治大風此方本之故其義與金匱血痹黃汗黃疸諸用黃耆方不同而同以彼症亦由衛虛挾風故也其防術並用取諸金匱桂芍知母湯方中亦以彼症由風汗之故以彼證此斷可知已必其人之症如方下所云始可用之倘其汗不由於風或微有風而屬在表虛里實之體即不可服服之則衛以被托而益虛表虛而里益形其實諸氣不和雖本無汗且可使有汗奈何忌汗而藉此止汗耶且屏風之名兼有屏絕屏擋之義若專以屏藩屏蔽為言則豔其名而沒其實矣大抵古今名方苟得仲景之一端即非望文而可曉讀者當以意逆志焉磁石治周痹解人皆知磁石之益腎氣也而本經獨主周痹痹為風寒濕三氣雜至之病未必皆由腎虛經意何所指乎蓋嘗歷考方書乃知磁石能吸通一切擁塞之氣塗於外則從外吸內如入升藥提毒納喉中引針是也以彼例此治痹之義灼然矣經隧中為風寒濕所阻而成痹亦系擁塞為病故須此以吸通之第古方中依經直用者絕少而繹周義為流之理則凡擁塞之處無非痹氣所流之外故用之者不必規規於經文而自合經旨且因此益知益腎氣之故焉心肺主呼肝腎主吸能吸之物與喜吸之症其氣相協虛者得吸以實之謂為益腎也固宜特不比泛泛益腎如山藥地黃輩耳臨證者審諸每見上下俱虛之人咳喘吐血醫用磁石漸至肺萎延成死症實由吸傷上焦之誤而醫者無一悟及可慨也夫案仲景書不及此藥者仲景為傷寒設法原書不別出金匱金匱亦論傷寒之雜病也寒邪從外入內不可再服磁石使之從內吸外故不及也人參解人參性效近陳修園砭新方八陣辨之而未盡也泉謂仲景於亡脈亡血並用人參者非以人參為能生血脈也特培其血脈所由生者耳脾主為胃行其津液津血同類津液不行則血亦減少而津血又皆元氣所生元氣實藏於脾人參專能補脾脾王而氣液充則亡血亡脈皆愈故人參之補脾實人參之培元氣也惟人參培元氣故陽虛者得之能益氣如四君子湯是也陰虛者得之能蓄津如人參白虎湯是也且人參反大黃大黃功專瀉胃而胃為萬物所歸能瀉胃者必能瀉胃之所及人參功專補脾而脾為諸經之母故補脾者必能補脾之所統推而暨之大黃無所不瀉人參無所不補凡通治之藥准此桑根白皮解據本經主傷中五勞六極羸瘦崩中絕脈補虛益氣云云則桑白皮補肺也別錄則主肺中水氣唾血熱渴水腫腹滿臚脹利水道去寸白縫金瘡似桑白皮又瀉肺也豈相背哉蓋本經中字皆指胃言胃主肌肉百脈秉穀氣而成則羸瘦絕脈亦系胃病補虛者補胃之虛益氣者益胃之氣胃以下行為順上逆則肺不平而肺病作本經著治胃之效而肺之平不言可喻也別錄以經義隱約故推衍之其主治皆胃逆陵肺之症一本一標詞相反義相成肘後方以之治消渴尿多及產後下血是宗本經為用錢仲陽瀉白散治小兒肺經實熱是宗別錄為用百合病用百合解仲景以百合治百合病專方也諸家注從未有能道其故者案本草經百合除邪氣利大小便百合病症狀雖變幻不一要之小便赤黃一症則有定仲景於至無定中求其有定者以立診治之准此百合病所以必用百合也百合病重在小便故於頭痛頭淅淅頭眩諸足以卜愈期者皆於小便時診之凡辨疑難症皆當準此夫古人至奇之法實有至常之理淺人泥於百合補肺之說因以肺朝百脈為之解淺也又百合病者由於餘邪逗留血氣不潤所致如意欲食而或美及欲臥欲行雲云狀其無大邪之抑正氣有時得伸也復不能食至不用聞臭不能臥不能行雲云狀其氣血少潤也如寒如熱肌中不潤而滯澀也無寒無熱餘邪不能作勢也口苦胃液被餘邪所吸不能消淨食物也得藥劇吐利胃液不充反為藥所勝也脈微數微為血氣少數為邪氣止也溺時痛見於頭者溺為去液之事故病液少者卜之於此下虛則上實也此證之於症而合者也其治法專以滋潤為主故本方於百合外加生地汁津血並潤也汗下吐皆傷液故隨上下之所傷而救之知母雞黃皆滋潤之品滑石為潤下之品惟赭能逐邪欲乘其方下而逐之也變渴則栝蔞牡蠣變發熱則滑石無非取乎其潤此證之於方而合者也然後知本經百合除邪氣利大小便云云皆潤之之效也大抵病至邪留正虛之時攻則害正補則礙邪惟有潤之使正紓邪浮始可設法逐邪其逐邪之法總不出傷寒差已後更發熱者小柴胡湯主之脈浮者以汗解之脈沉實者以下解之數語決不以百合數方了事也惟至此時則病之局勢已移不得仍以百合稱故百合病止此耳讀仲景書如讀春秋左傳當取他傳續此傳後而後紀事之本末始全仲景用桂枝例解仲景之用桂枝不獨太陽病為然即已見里症而表猶未罷者亦用之故建中復脈雖於滋膩中尚借一味桂枝以達餘邪而桃仁承氣湯黃連湯桂枝人參湯柴胡薑桂湯當歸四逆湯烏梅丸諸方之用桂枝准此矣其尤著者陽明太陰二篇皆有浮脈者宜桂枝湯之論可見無表症而有表脈者猶當用桂枝所以然者有表脈則氣連於表與未罷之表症同無表症則不得不隨其所見之病以為隸近人泥桂枝為太陽經者究未明其例也夫仲景之用意雖深能善讀之則義隨文見自有跡之可尋此所以為醫學中百世之師也桂枝加芍藥生薑人參新加湯解任分則權分任專則權專權分則功分權專則功專分者我與人均專者人由我使桂枝湯桂芍俱三兩則桂自驅風芍自斂汗各不相假所謂任分權分而功分也此方桂三兩芍四兩則芍能使桂桂雖有驅風之能亦不過以辛溫善達之氣助芍藥宣已痹之血而不得獨炫其長所謂任專權專而功專也加生薑之義可以類推此論身疼痛在發汗後顯屬汗後亡津血氣痹著之象津血同類故從血痹治芍藥生薑皆治血痹故獨重其分亡津故加人參與白虎加人參湯症義同何以知此身疼痛為血痹也以脈沉細知之栝蔞桂枝湯症亦云脈沉細而其病由於亡津以彼例此昭然已桂枝附子湯去桂加朮解論曰此本一方二法以大便堅小便自利去桂也以大便不堅小便不利故加桂其義深奧難明注家皆不得之近徐氏類方則云桂枝能利小便又云白朮能生腸胃津液亦屬牽強繹經意以身疼脈虛而澀為表虛挾濕復以脈浮推得有風復以不嘔明其無里症故以桂枝解表之風附術解表之濕其可確指為濕者全在不渴二字上勘出故脈澀作陽虛挾濕論也然果繫有濕必大便溏小便不利若大便堅小便自利則非濕症矣既非濕症而見身疼虛澀之脈是專屬陽虛可知即其脈浮亦平脈法所謂浮為虛也不得再用解表之藥以重虛其陽故決然去桂桂去而朮附皆轉為溫煦陽氣之用矣二方之別所以明二症虛實疑似之辨者至矣大青龍湯麻杏甘石湯越婢湯解三方皆麻黃石膏並用乃表裡同治之法也然石膏雖曰治里而本草亦稱其能解肌是三方者必也表裡俱有熱而又擁於上焦者宣之且其為制也大青龍湯麻黃六兩石膏如雞子大麻杏石甘湯麻黃四兩石膏八兩越婢湯麻黃六兩石膏八兩是皆石膏重於麻黃石膏為主麻黃為佐則解熱之杈勝麻黃雖有發散之性只得於解熱中疏其鬱滯而已性隨制變故仲景用大青龍必提出煩躁二字而以脈弱惡風戒其誤用以見大青龍專為煩躁設于越婢湯則主自汗出無大熱於麻杏甘石湯則主汗出而喘無大熱以見二方專為喘汗設煩躁喘汗症雖不同其為上焦熱擁則同故立法亦同近柯氏琴來蘇集疑麻杏甘石症汗出而喘無大熱七字為誤欲移無字於汗出上其不足與語仲景化裁之妙用必矣小青龍湯解古經方必有主藥無之者小青龍是也何以言之方中麻芍薑辛桂甘各三兩味夏各半升考古半升約古分亦三兩仲景每以半夏半斤配生薑三兩五味半升配生薑三兩此方正其例也八味輕重同則不相統故曰無主藥或謂麻黃先煎即是主藥豈知麻黃以有沫當去不得不先煎與先煎澤漆先煎大黃有別特以肺為水源以此疏其壅塞耳且本方加減法云去麻黃者四麻黃在可去之例豈主藥乎匪特麻黃非主藥也即桂枝亦不過因表不解發熱而用之其與芍藥甘草同用全乎桂枝湯矣桂枝即非主藥芍藥甘草更可知已又何論半夏乎此方本從桂枝湯來而其義則在乾薑五味細辛三味本論於柴胡湯四逆散方下云咳者加乾薑五味子細辛即此方主治之義柴胡湯方下又云咳者去人參生薑大棗加五味子乾薑即此方用桂枝湯所以必去棗姜之義然則小青龍為治飲家咳之方故凡用乾薑五味子而與若桂若麻並施者皆自此出如金匱厚朴麻黃湯射干麻黃湯苓桂五味甘草姜辛湯苓桂五味甘草姜辛半夏湯苓桂五味甘草姜辛半夏杏仁湯苓桂五味甘草姜辛半夏杏仁大黃湯六方是也論此方所從來當入桂枝類論此方所由衍當另建一類而六方隸焉斯當矣當歸四逆湯症解論曰手足厥寒脈細欲絕者當歸四逆湯主之此症比諸四逆略輕所以改用當歸者在一細字上勘出諸四逆皆脈微無言細者微細雖皆亡陽脈而微為無氣細為無血其指不同本論云下之後復發汗脈微細以微自汗來亡陽細自下來亡陰以彼例此細為血虛顯然金匱云血虛而厥厥而必冒是厥固有生於血虛者故必以當歸溫經芍藥治痹而後血利細辛開之通草穿之而後血流其用桂枝者取其散表寒也方意如是論又曰下利強下之脈浮革因而腸鳴者屬當歸四逆湯浮革亦血虛之脈腸鳴亦血虛之因又在利後與此正足相參此四逆症自屬半表半裡千金謂為陽邪內陷之治者得之夫強下脈大亦兼表耳侯氏黑散解釋此散者言人人殊皆無確據考病源寒食散發候云皇甫曰寒食藥者世莫知焉或曰華佗或曰仲景考之於實佗之精微方類單省而仲景經有侯氏黑散紫石英方皆數種相出入節度略同然則寒食草石二方出自仲景非佗也據此知侯氏黑散系石發家服食之方故有冷服填腸之說石熱之發亦足召風故入之中風大約服石之風創於漢季盛於隋唐仲景傳方而後外臺用此尤詳宋以來服石者鮮此散幾廢近喻嘉言誤指為中風主方踵其說者見其藥不對症未敢遵用因專取菊花一味以為本諸仲景而此方之義湮詳余所撰經方例釋中案喻氏之意以經文中有中風之論而方止黑散數種耳豈知中風自以續命為主方外臺中明謂續命為仲景方今金匱無者脫也詳余所撰金匱方論注中天雄散解金匱天雄散有方無論近人不得其說或疑為後人所附而議去之泉謂此乃陽虛失精之祖方未可去也古者失精與夢失精分而為二夢因於風夢失精者虛而挾風故仲景以桂枝湯中加龍蠣治之桂枝湯中風方也不夢而但失精者虛而挾寒故又以天雄散治之天雄祛寒壯陽之藥也其治失精於何徵之病源引失精家少腹弦急陰頭寒目眶痛發落一段經文於失精候而外臺即以範汪天雄散隸之範汪方較仲景止少龍骨一味而注中引張文仲有龍骨與仲景一味不差此天雄散治失精之證也古失精近滑精也局方金鎖正元丹蓋取諸此理中四逆方義解大凡思義必先顧名仲景書名傷寒則方義自系治寒寒邪從表乘里裡氣不支揮霍撩亂勢將直搗此時未暇顧表先與建里故但用參朮甘姜四味而置頭痛發熱身疼諸證於不問亦以實其里本無妨於表也俟亂一定然後解表以截來路方下所以有吐利止而身痛不休者當消息和解其外宜桂枝湯之論也理中專為此設並無伏熱痰食在內故無壅塞橫決之慮不然則有因而致變者矣其緩者更有桂枝人參湯即理中加桂枝法與先理中後桂枝者同一表邪乘里而分治合治猶尚有別況於裡實者而可無別乎至於四逆亦為表邪乘里而設但見厥則所乘已在三陰較理中症尤重乃反不用參術何也蓋以寒邪已入三陰則里為實與理中症寒邪將入三陰其里猶虛者先後止爭一間正如婦人臨產可服補劑助力已產則有血肉瘀不得再補之比知此始可與言虛實矣且吐利而又厥逆為表裡同病故既以乾薑溫里即以生附托表其與真武湯附子湯之用熟附益氣迥然不同然則桂泄三陽生附泄三陰經有定例非僅以性熱兩字了之夫一寒之傳變其別如此則凡不止一寒本先裡實者從可推已用此二方但將已所診症細細與仲景論中義例相參合則用不合則否毋執成見為也
