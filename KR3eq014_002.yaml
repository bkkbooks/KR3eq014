body:
  text: 卷二學醫説夫欲學醫必先讀無方之書則莫善於巢氏病源焉病源引申經意別類分門比靈素為易知亦較靈素而易入習之既久遂乃上探靈素兼讀難經甲乙經二書以疏之明乎經絡臟腑之源達於望聞問切之故而於嚮者之所得益覺融會貫通而明體者漸漸達用矣然後讀有方之書玉函傷寒金匱是也讀三書尤必兼資脈經以稽其異同披本草須用證類本草以觀其方法蓋臨病之舟楫在焉然傷寒之理未許其遽通也又必浸淫乎肘後千金及翼外臺四書斟酌乎本事方百證歌九十論明理論等説參互考訂以徐俟其悟殆另有一境矣大抵醫者之於傷寒其致力每在雜病未究之先其得心轉在雜病悉通之後不親歷者不知也溯流窮源其事止此神而明之存乎其人至於聖濟局方以下則學成後讀之亦足擴聰明而煉識力不必概屏之以自隘也診訣説診病之訣在知表里虛實逆從六字第欲臨診時知之明必於讀書時知之豫夫仲景之辨表里二字亟矣而喜言統治者或不信謂靈素論症概以六經臟腑為別何嘗有所謂表里者不知兩經為針法設不為藥法設針法在取穴但審其何經何臟何腑而巨刺繆刺諸法已可施不以表里為汲汲也若藥法則清輕宜表重濁宜里如此而已且其為氣化於胃運於脾布於肺如飲食然斷無專走一經之理故必分表里而後汗吐下補諸法各如其輕清重濁之性以為用仲景之詞所以異於靈素者此爾至於虛實則有二義邪在為實邪不在為虛一也邪結為實邪不結為虛二也皆為瀉邪地非為用補地試取諸經論讀之當不以余言為謬至於逆從二字則色脈證治皆有之須先審定其病而後可言也神而明之死生可決已內經熱病説兩經於一切身熱之診皆稱熱病是以素則勞風腎風同評於溫後靈則如蟲如疸並列於熱中至其散見他篇尤不可勝數蓋以可診者言不以所因者言其可專以傷寒之成溫者言乎夫為身熱一證舉其尤而窮其類尤者詳之類者附之固當如是與仲景論傷寒而及似傷寒之痓濕暍同意淺人每論溫熱舉兩經熱論或採之或剩之果有當於病源否也其言暑者只作熱字解素通天因於暑及骨空立而暑解等並不指夏令之熱如後世所云或採通天論之言列於夏病真不得經旨也其言溫者只作蘊字解素熱病先夏至者為病溫云者意以夏至後天氣熱人易於感則言熱夏至前天氣未熱人無所感故止就所蘊者名之而言溫則仍取乎本義非如近世訓為小熱也不觀今之病春溫者乎赫赫炎炎豈是小熱讀書不明義例古法於是盡湮矣七傳辨誤説難經七傳傳其所勝間傳傳其所生皆止言五傳注家不得其説以心復傳肺數之其實止得六傳無七傳且間傳之如環無端何嘗不如是而經獨以傳其所勝為七傳也揆之於理殊覺牽強竊謂七字當為次字聲之誤也古音去聲入聲不甚分別如書康誥勿庸以次汝封次字荀子引作即之比何以言之素玉機真臟及標本病傳兩篇於傳其所勝者皆謂之次傳無言七傳者且標本病傳篇末明云諸病以次是相傳如是者皆有死期不可刺間一臟止及至三四臟者乃可刺也其義與真臟風者百病之長也以下至此病之次也數段甚合然則傳其所勝者之為次傳經有明文乃病傳之定例難經原文必不誤後人傳寫誤耳千金方卷七經云次傳間傳是也亦其一證又難經於間傳言如環無端者乃就一臟之傳其所生而卒言之與素問本無不合而徐氏泥素問難經之文以相駁詰真多事也傷寒傷暑説古者於冬月觸冒正邪之寒及夏月中時行之寒皆稱傷寒故仲景存或已發熱或未發熱兩者於傷寒條已發熱者時行之寒未發熱者正邪之寒意在統一使人易識耳至巢源始別傷寒時氣為二門而於小兒傷寒候並列兩寒特以一語示別曰時行傷寒亦簡且審唐人乃曰天行熱病天行即時行但時氣二字之義本兼四時為主而時氣二字之名若惟熱病獨擅其為語似混然歷考志乘凡疫皆在春夏秋三時而夏尤多仲景自春分至秋分有非時暴寒皆為時行寒疫之言益信古者於夏月觸冒正邪之暑及冬月中時行之暑皆稱傷暑素形氣虛實氣虛身熱之傷暑不必專以夏言也仲景始別之以中暍冬溫兩名然溫病難經不指定何脈仲景止略陳其症狀則是所發無定不必其盡發熱惡寒也凡咳嗽腫癰皆得有之仲景雖不明言其散見於千金外臺者可舉一二以推蓋傷暑二字之義雖得兼通夫四時而傷暑二字之名不得概施之冬月此古今稱謂之所由異也疹斑互訛説外臺引素問逸文赤疹者搔之重沓隴起及病源赤疹白疹兩候即今所謂風斑也金匱陽毒面赤斑斑如錦文及病源千金外臺斑瘡即今所謂疹子也凡宋以前醫書皆如此分別於字義甚協疹者診也必皮膚有所變疹浮起方合疹稱觀病源屢言軫軫起合之素問隴起之詞自見斑者點也必有點子方合斑稱觀病源斑爛云云自見近世不正其名遂至互訛今則競以疹為斑以斑為疹相沿既久苟或正之則反遭譁笑以為大謬然茲二病雖皆有毒而疹由於風不由於溫斑由於溫而前受之邪未必皆風病因久暫既殊治法輕重亦異古人各有主方不可混施不審乎此無惑乎謂古方不可治今病矣論語曰必也正名乎凡事皆然古方癥蟲混稱説古方於痓瘕及蟲病往往混稱然動者為蟲不動者為痓瘕分別亦不難良由蟲所居處其阻礙氣血實與積同故混稱之耳如病源十九酒瘕云有蟲使之然夫能飲人所飲酒則動矣而巢氏入之癥瘕門後世直稱之為酒蟲其食症能食人之所食飯以酒瘕例之是亦有蟲使然也而巢氏則但稱為症而已此混稱二病之證也推之綱目所載茶瘕吐出後猶能飲茶亦其類矣崔元亮海上方以地黃餺飥治心痛吐出蟲長尺許頭如壁宮劉禹錫傳信方崔抗女患心痛食地黃冷淘吐出物可方寸許狀如蛤蟆無足目似有口此二物皆不云動明是瘀血所為癥病也而以蟲狀之諸如此類不可枚舉讀者當以意逆旨勿泥其詞況醫書之傳自文人者又多形容過情者乎余作證原以能動及飲食者入之蟲不能者入之積非違古也古略今詳有勢不得不如此者扁鵲見垣一方人説史記五百扁鵲傳載扁鵲飲長桑君藥三十日見垣一方人由是診病洞見五臟癥結特以診脈為名注方邊也言見牆垣彼邊之人也案如注説是謂能隔牆見人矣長桑何藥而乃變易形質若此耶竊謂此當與紀昌貫蝨同義大抵久竭目力則所見必異蝨大如輪以徑言也垣一方人以深言也迹雖不同理則一致想扁鵲學望診時必日視其垣以煉目力而以意合之人面久之則垣中淺者深者一一分明便似其中有人在云一方者正就其日所注視者言非彼邊之謂且彼字尤屬添釋史文無此義也余嘗師其意而為之雖未能見人亦似有眉目可別雖未能洞見臟結臨症時看人面及舌色浮沉大小濃淡一目瞭然不待多時而細察故謬揣史遷此言系形容之詞非果隔牆見人且扁鵲脈法具載脈經果以診脈為名豈其言皆虛飾耶史遷於此及倉公兩傳皆未能實疏所以但據人間形容之詞不復顧其過當良由其於醫事未能了了耳班書不録豈無故歟範書不為仲景作傳亦當以其妙難言喻恐轉滋人惑也陳志華他傳多據實質言之診虛須知勞極説古有五勞七傷六極之目皆言虛也核之則勞極二端而已勞是過用其氣極則幾於無氣其淺深不同以病源所記言之五勞中之志勞心勞憂勞是過用其神其疲勞是過用其形七傷則房勞之病亦勞屬也以其病多故別出之然精為七神之一是亦過用其神也約之特形神二者盡之矣若風寒暑濕及一切病之久而不去甚虛其氣者皆極也極有氣血筋骨肌精六症者謂病於氣其極也不欲言病於血其極也無顏色眉發墮落喜忘余極仿此然約之亦不外形神也大抵勞言其始極言其終分別截然近世不知有極概目為勞則將以治極者治勞而勞永無愈期矣嘻溫疫説溫也疫也溫疫也三病之稱第稱溫疫者為定名而稱溫稱疫者為虛位溫者蘊也儒書謂夫子溫良言容之蘊詩教溫柔言辭之蘊良玉溫潤言彩之蘊醫書謂春氣溫和言陽之蘊則病之稱溫必以其邪之蘊也蘊寒曰溫蘊熱亦曰溫傷寒例冬傷於寒至春變為溫病是蘊寒者冬有非節之暖名曰冬溫及巢源冬感非時之暖至春亦為溫病是蘊熱者所蘊不同而其為溫則同也言乎其治則一於寒何也其初則異其終則同也然而論治可通者臨文必不可通著書之指固與臨症別也疫者役也傳染之時病狀相若如役使也役於寒曰疫役於熱亦曰疫傷寒例之疫可謂是疫於寒者巢源千金以下諸書之疫半是疫於熱者所役不同而其為疫則同也然此所謂寒若熱者非正邪之寒熱也必惑夫反時者始相役也故溫有正邪之溫而疫無不由於賊邪古謂賊病為時氣一曰時行故後世稱疫為時疫然時氣乃賊邪之混稱不暇詳其傳染與否也其傳染者若僅目之為時氣則無以示別也且傳染之氣惡於不傳染者不得不別也疫氣惡故疫亦曰癘疫癘之為言惡也此疫之別於時氣也或曰如此則役於熱者不幾與溫相混乎曰否冬溫亦以傳染者為疫其未經傳染或止就一人言之也直稱溫不得稱疫溫者先乎病以言之疫者後乎病以言之以其各有寒若熱故曰虛位若合溫疫兩字以名之之病則惟傷寒例陽脈濡弱陰脈弦緊遇溫氣變為溫疫者可以當之以其先有溫邪又傳染時氣中之寒之役使者例不得另立一名故疊此兩字以呼之所謂定名也至於溫熱云者其指多本內經先夏至為溫後夏至為熱之文而括其輕重之謂倘知溫之為蘊則溫熱兩病之僅皆屬溫可決已周揚俊以溫熱暑疫名其書而王孟英著溫熱經緯復雜取傷寒論文皆由不能識別則不敢正稱而姑以含糊囫圇可以附古可以欺今之溫熱兩字為藏身之固使人不便顯言其非耳近世醫説之不足恃類此溫瘧説古者於冬傷於寒不即發至春遇溫而病者及冬中於非時之暖不即發至春遇溫而病者皆胃之溫故仲景既存素問傷寒成溫之論復於冬有非節之暖稱為冬溫以溫之言蘊所蘊不同而為蘊則同故通為溫巢源溫病候溫毒候皆兩存之固深於仲景者也準此以推夏之暑亦當如是夏傷於暑不即發至秋遇風而病者及夏傷於非時之寒不即發至秋遇風而病者皆謂之瘧故素問瘧論有夏傷於暑之痎瘧而生氣通天及金匱真言夏暑汗不出秋風之瘧以瘧之言瘧為瘧不同而所虐則同故通為瘧惟仲景專為寒字立論故不及夏暑即發不即發之病而巢源以下亦仍之而不復分晰也春主溫故溫性緩緩則性長故為病壯熱而其脈為緩弱秋主風故瘧性暴暴則性短故為病休作而其脈緊弦溫宜於下則瘧宜於吐治瘧之常蜀猶治溫之硝黃也惟溫在冬月故發有先後重沓則治有汗下兼施與瘧之吐下兼施微有不同者此耳溫瘧有三説古稱溫瘧有三素瘧論兩溫瘧巢源總敘之意謂冬中於風寒氣藏於骨髓至春遇大暑或有所用力邪氣與汗偕出之溫瘧止有先熱後寒者而無先寒後熱者何以言之經以先風后寒為先熱後寒之因先寒後風為先寒後熱之因大暑為時令不必數故止數風寒之先後所以止有先熱後寒者也若夏傷於大暑腠理發泄遇夏氣非時小寒藏於腠理皮膚至秋傷於風則病成之溫瘧則有先熱後寒者又有先寒後熱者何以言之以此暑也小寒也秋風也為三感則當置其一輕而論其兩重若傷暑重而秋風輕則置風而論暑寒而為先熱後寒之瘧若暑輕而秋風重而置暑而論寒風而為先寒後熱之瘧也復總而別之曰夫病溫瘧六七日但見熱者是矣此謂壯熱不兼寒者故加夫字示與經文別出也不析言冬夏者明冬夏皆有此壯熱者也此與先熱後寒先寒後熱為三矣大法由冬來者即今春溫由夏來者即今伏暑古既統稱溫瘧則本草諸治溫瘧之藥皆是治春溫伏暑明甚金匱白虎加桂枝湯症正此也此外尚有傷寒論脈陰陽俱緊者重感於寒變為溫瘧則冬傷於寒至春分以後復感時行之寒者先後皆寒與寒多之牡瘧同理故金匱蜀漆散方下云溫瘧加蜀漆當即指此越其外受之蒙即以截其遞入之路而俗稱蜀漆截瘧亦以辭害旨哉若白虎加桂枝湯方自是治春溫伏暑之溫瘧與重感於寒之溫瘧無涉故其方同傷寒法不同瘧法也黃疸黑疸説金匱云理者皮膚臟腑之文理也以此推之腸胃之膜其有罅縫可知人若脾虛不為胃消水穀則水穀之停於胃者久久則瘀而為熱其氣從腑理中溢出食氣溢則皮色黃水氣溢則皮色黑其有脾本不虛但因飢暴多食渴暴多飲所受倍常則脾不及消亦久留於胃而為熱即亦從腑理溢出此癥瘕系氣溢飲等證所由來也夫腑既有理則尋常飲食其氣何嘗不溢不溢則何以生衛以肥肌熏膚充身澤毛生營以成脈華色乎特所溢者是精氣非滯氣精氣益人滯氣病人耳人若肺虛為風濕寒熱怕襲則皮膚之理實而閉腑理中之應溢者不得通於外則水穀之氣亦久留於胃而為熱滯則溢遲故色變也傷寒溫病所致之疸及風疸濕疸皆取諸此雖不自飲食致之而其為溢之滯在理則同矣獨是水色雖黑然留胃之水亦黃中帶黑不能全黑以胃為土土色但黃故也惟涉及於腎則黑黃相半所以然者腎為胃關關門不利則水之流於腎部者留久其責在膀胱膀胱亦腑也亦有理也不挾熱者水溢為飲巢源云痰在胸膈飲在膀胱者此也其挾熱者則氣與水蒸而為疸金匱診疸於谷疸酒疸但言黃而於女勞疸必言額上黑以女勞則腎虛而利水遲水即久留而氣溢且胃中之水乘腎虛而流疾腎故不及利也推之風水正水石水為病之義亦當如是黃疸久之皆亦為黑疸者胃實滯多則乘腎腎以得水穀之精氣少則益易乘也知腑理之為病而推之奇病中有飯粒出瘡孔蛔蟲在皮中者皆不足為奇矣又金匱之例於風濕搏於水谷而成疸者稱黃疸與谷疸酒疸女勞疸黑疸為五其與傷寒同法不必搏於水谷者則但稱黃論中諸黃疸云云以此別之疸為勞熱食勞女勞之有疸猶食勞女勞之有復也勞疸女勞疸二症説五疸中惟勞疸女勞疸多相混故或去勞疸入黑疸以足五疸之數但勞疸之名舊矣病源名勞疸為勞黃與十種黃並列其女勞疸則次黃疸谷疸酒疸黑疸之中是勞疸屬黃女勞疸屬疸所屬不同外臺引集驗刪繁皆有療勞疸之方用苦參龍膽草梔子三味以牛膽或豬膽和丸而與谷疸並列是勞疸療與谷疸同而近效云女勞疸療與黑疸同是治法亦不同二疸為證相似所異者勞疸微汗出手足間熱小便利而女勞疸無之女勞疸發熱惡寒足下熱而勞疸無之且診其少腹但急不滿者勞疸急而滿者女勞疸此其要訣自金匱勞疸條衍女字而後世遂不知此義矣詳余所撰金匱方論注中三消説古今諸家言消渴者不一要當以金匱為正金匱首列厥陰病一條是渴而不消次列脾約症一條是消而不渴次列腎氣症一條是消渴並作其旨以飲溲相較而分為三最為簡當猶霍亂之分但吐但瀉吐瀉並作為三也其言飲一溲一者乃較其出入之多寡以出診法也推詳其意似有可以飲多溲少飲少溲多飲溲相當為三者亦即就前三者而引申之也其兼及能食便難者乃旁參他症以為出治地也並非三消必定如是後人誤會其旨所以説歧而義轉未備泉嘗即金匱以推諸家之言知所謂能飲不能飲及溲如麩片如油及溲數不數者皆當作診法觀不必致辨總之但渴者有燥濕兩種五苓白虎是也但消者有虛實兩種脾約腎瀝是也消渴並作者有寒熱兩種黃連腎氣是也其方備見唐人書中但不以兼證測之不確也故諸家云云痱與喑俳不同説凡辨症須於同中求異如痱與喑俳是也靈熱病痱之為病身無痛者四肢不收智亂不甚其言微知可治甚則不能言不可治也是痱之名名於四肢不收不收則廢也素脈解內奪而厥則為喑俳此腎虛也少陰不至者厥也注俳廢也腎之絡與衝脈並出於氣街循陰股內廉斜入膕中循胻骨內廉及內踝之後入足下故腎氣內奪而不順則足廢是痱與俳之名併名於廢也但痱為腫喑俳則不腫痱至喑不可治喑俳則以喑為正以此為異故治痱用續命湯而喑俳宜地黃飲子補瀉天淵已乃宣明方反云地黃飲子治中風舌喑不能言足廢不能行此少陰氣厥不足名曰風痱則混痱與俳自河間始以地黃飲子概治中風之誤自河間之混痱於俳始少陰不至謂太溪脈絶仲景原尸厥云少陰脈不至本此經以太溪絶為診厥之法故云少陰不至者厥也河間少陰氣厥不至六字殊誤氣厥正是至何云不至也癲説古之所謂癲者二一眴僕之癲靈素所謂巔疾王注謂上巔之疾是也與狂對舉其病自足太陽經來其名以巔疾二字稱其義取顛頂為説此其可治者也惟由胎驚得之則難治一昏亂之癲難經所謂重陰者癲金匱所謂陰氣衰為癲是也雖亦與狂對舉要之即狂之甚者其病自心肝兩臟來其名以一癲字稱其義以顛越為説此則必不可治後人概加疒旁而二癲乃不能別而諸書之論亦不可盡曉必如此分別斯各各相通矣靈本神喜樂無極則傷魄魄傷則狂狂者意不存人悲哀動中則傷魂魂傷則狂忘不精明不敢正當人彼二狂不同故經文自為之注其魂傷者則癲也正金匱之所本素調經血並於陰氣並於陽乃為驚狂此一狂乃是渾稱其血並於陰者則癲也正難經之所本泉嘗遍考而核之曰古之巔疾今之癇也古之癲今之癡也執是説也庶不至謂古方不可治今病乎臟色單見説一人之臟色單見猶天之運星獨明也太過之運其星明不及之運其星減明則自旺減則所勝兼之人之於色也亦然金匱云肝旺色青四時各隨其色由斯以推何臟色見即是何臟氣勝觀其所勝而源委可見已何以言之五行相乘如夫婦然夫為婦綱以能乘者為正不能乘者為變陰陽之義也故病在此者知其因必在彼也此負者因彼之乘而太過病也此勝者因彼之弱不能乘亦病也乘而太過則彼強而當見彼臟之色弱不能乘則此強而當見此臟之色故凡其色獨見者皆勝也非負也值不及之運而曰運星獨明者未之聞也顧見注家輒云脾虛而色外見嘻果系脾虛即使色不純青亦當於淡黃中見青如不及之年運星必兼勝星之比豈得獨見黃色哉且也色與脈應臟和則脈和而不名一象偏勝則弦鉤毛石隨所勝而為象脈弦不得謂之肝負則色黃反得謂之脾負乎倘因此而用益脾之法則差若毫釐繆以千里矣臟色單見説二或難之曰子言何臟色見即是何臟氣勝而靈樞黃色薄皮弱肉者不勝春時之虛風雲云非明明以見何臟之色為何臟之虛乎曰是大不然經意非春風病脾之謂謂臟色單見者臟勝也而薄皮弱肉者稟虛也稟虛而臟勝則非臟之真實也其為勝我之臟弱不能乘顯然也如春肝旺時也肝既弱矣焉得不畏虛風乎春之虛風西風也其氣乘於肝肝受之非脾受之故知非春風病脾之謂也靈樞之文看似直易而其義層纍奧衍極耐尋繹余説正與之相發明不得據以為難其真臟虛色見者惟肝氣先絶而吻青心氣內索而面赤之類可以當之要非尋常之症所可同日語也脾脈説脈經脾脈長長而弱來疏去數再至曰平案長長謂來長較去短者為疏故以來疏申之弱言其和柔與素脈要精微義合彼文曰平脾脈來和柔句相離如雞踐地曰平雞之踐地舉足舒而下足略促故取以形容來長去短之脈且如雞踐地之象去來略差不似夏脈之鉤來盛去衰秋脈之毛來急去散也如雞踐地之象去來略斷不似春脈之弦長而相引冬脈之石絶不相續也此所以為脾脈也鳥喙之兌兌古鋭字鳥距之堅正和柔之友屋漏之止而時行水流之行而不止正相離如雞踐地之反又再至非數而云去數者非一息六至之謂但謂其密耳對疏言之也病源作來疏去穊穊正訓密較脈經易知數之為密亦有確證孟子數罟不入汙池罟數即密綱是動所生病説靈經脈十二經皆有是動所生病難經以氣血二字釋之後人不得其解反以為非泉謂榮行脈中衛行脈外此經以脈為主自當兼榮衛言是動者衛也衛主氣故以氣字釋是動所生病者榮也榮主血故以血字釋所生病於義甚合且經於是動在手太陰雲臂厥足陽明云骭厥足太陽云踝厥足少陰雲腎厥足少陽雲陽厥諸厥皆以衛言於所生病則各就其脈所過者不似是動之或循脈或不循脈正以榮有定位故也其榮衛俱有之症則兩出之如手太陰之咳喘是也凡脈病當以此篇為正餘篇及素問則或合臟腑言或互衆經言言各有當窮經者當即此篇以究他篇則病之所屬自明勿執他篇以疑此篇也古湯液丸散同方異法説傷寒論辨可汗云凡云可發汗而無湯者丸散亦可用要以汗出為解然不如湯隨症良辨可下云凡服下藥用湯勝丸散考仲景書汗方除桂枝麻黃等湯外別無發汗之丸散今此云云可見古方湯液丸散隨宜酌之不似後世異法者必異方也仲景於此起例如理中丸及湯半夏散及湯抵當丸及湯蜘蛛散及丸其最著者也而於病後喜唾用理中丸胸痹用人參湯於小腹硬滿小便利如狂者用抵當湯於但小腹滿小便利者用抵當丸非隨症異法之證乎他如太陽篇云傷寒十三日不解過經譫語者以有熱也當以湯下之若小便利者大便當硬而反下利脈調和者知醫以丸藥下之非其治也若自下利者脈當微厥今反和者此為內實也調胃承氣湯主之丸謂調胃承氣丸也此症宜湯下不宜丸故辨之尤明且也仲景有麻黃湯而深師直作麻黃散仲景有乾薑附子湯而肘後變為薑附丸仲景有枳朮湯而張潔古變為枳朮丸吾湖郡志所載有以小柴胡散治病不效且作湯即效者皆足證余説也雜病治法折衷説仲景之傷寒論金匱要略二書古總為傷寒雜病論雜或為卒卒即雜之剝文勿作傷寒為倉卒之病解外臺總稱為傷寒論詳泉金匱方論注序注是所謂傷寒雜病論者為傷寒中之雜病説非為一切雜病説下另有論徒恃此書不足與治雜病則千金尚焉孫氏亦推本仲景而其論症之精詳用藥之變化雜法之明備數倍於仲景書非仲景之賢不及孫氏也仲景既以寒字目其書自專於寒科盡其變其他病因例不羼入若千金統論百病凡風雨寒暑飲食居處陰陽喜怒諸因隨病聚則二家命意不同故其書詳略亦異讀者能各得所宗則傷寒雜病兩擅其長自墨守者以金匱為治一切雜病之宗而千金遂斥為僻書無惑乎學術隘而治法闕矣釋證名有所苦之謂病病無定所曰流亦曰遊其有定所而移者曰轉由此轉彼而此已罷者曰並病其依次者曰傳經其彼病而此不罷者曰合病其相為表裡之經俱病亦以次傳者曰兩感至邪已入里而有所著曰結結而有定形餘症悉罷者始曰積積而可移曰聚偏僻在側曰癖亦曰㾫假物而成曰癥瘕症言其可徵驗瘕言其為虛假本病源結而無定形久不愈愈而復發曰注亦作疰亦曰系氣其新病甫愈有因復發者直曰復亦作癁誤於醫曰壞病染於人曰易病病而至於氣竭曰極極有六言究竟也氣去曰死言澌散也大抵散者泄之結者排之誤者救之染者絶之症宜用此數法而正氣有不支者即於其中加補味以扶之歷代醫法約略如此釋露本草靈素屢言淋露寒熱靈樞又以歲露名篇露字人皆不曉泉案淋露即羸露古者以為疲困之稱左昭元年傳勿使有所壅閉湫底以露其體注露羸也韓非子亡徵好罷露百姓風俗通義怪神大用羸露皆此義也字亦肯作路詩皇矣患夷載路箋路瘠也侵伐混夷以瘠之管子四時不知四時之故天下乃路是也歲露者謂歲氣不及虛風困之民受虛風之邪即被困成病與管子之言正合楊上善注太素概以霧露當之陋矣傷寒例凡有觸冒露體中寒正本左傳淺人增霜字於冒下豈寒之為氣止霜露乎經文必不若是挂漏也病源有小兒傷食而瘦之哺露婦人産後瘀血之惡露皆其引申義也淋古多作癃楊注太素癃淋也而漢書有癃疲之病是淋亦通疲釋痓痙玉篇痓充至切惡也痙渠並切風強病二字義別素問氣厥五常政等篇及傷寒舊本痙皆作痓許叔微百證歌以為名異實同而字仍作痓不改成無己注傷寒則直云痓字誤亦不改今本作痙傳寫者之故近代但知痙無有能知痓者泉案作痓為是古人列病恆重乎證痓乃痙之總號痙乃痓之一端觀仲景云病身熱足寒頭項強急惡寒時頭熱面赤目脈赤獨頭搖卒口噤背反張者痙病也明此數者皆為惡候故知當作痓若痙字則因徑而起專指口噤背反張言不足以賅余惡是痙者證名痓者病名人體強直有似徑象故謂之徑去力加疒即為痙可逆溯而得也巢源亦作痓故得與癇冒混稱癇固小兒之惡候冒亦産家之惡候病不同而惡則同此其所以混稱之歟説文疒部無痓字廠部有厔字云礙止也然則邪氣礙止不去乃見惡候痓即厔之訛釋喘古之所謂喘即今之所謂氣促説文喘疾息也疾息謂息之疾者兩經多以喘息對説正以喘為疾息息為平息故也勿作串説疾息正今之氣促而又非氣短之謂短氣者息不必促而其氣不足以息故不曰短息而曰短氣氣促者氣不必短而其息不利於氣故脈經或謂之息促而後世渾言之則遂曰氣促也今之所謂喘即古之所謂上氣鄭注周禮上氣逆氣也逆氣謂其逆在氣則不僅責在息人之將死有張口抬肩而逆氣者此也淺者不識上氣謬目為喘由是今之喘重於古之喘數倍矣豈知此喘乃是氣逆苟非不治多有下之而愈者如咳逆葶藶瀉肺湯症及外臺備急丸症是也若疾息之喘是肺實所致宜用宣利如太陽麻黃湯症是也古人分別之嚴原為治法設非可苟焉而已自二症混而治法乖矣釋癲癲之言蹎蹎僕也凡物上重下輕則僕故人病氣聚於頭頂則患蹎素脈解太陽所謂癲疾者陽盡在上而陰氣從下下虛上實故癲疾也與厥論巨陽之厥發為蹎僕同義是明以癲為僕也癲經文作巔故注云頂上曰巔古字無巔止作顛後人加疒旁遂作癲亦或省作癲玉篇癇小兒癲病也是也且據玉篇知癲癇實一病病源亦云十歲以上為癲十歲以下為癇然則二字之分分於年之長少也金匱風引湯下云治大人癲小兒癇即此意近世不曉此義專指古之風邪為癲而以別於子癇執今之名檢古之書無怪乎其謂古方不可治今病矣釋淋靈素本草有五癃癃閉之名而仲景以下諸書並無之考楊上善太素注癃淋也因知淋癃乃一聲之轉毛詩皇矣與爾臨沖韓詩作與爾隆沖是其的證所以通淋於癃者以癃訓罷漢書云臣有疲癃之病注癃罷病也而素問説癃者一日數十溲則膀胱之胞罷疲矣故得假借取義近世不知此義歧而二之徐靈胎軌範以癃閉利淋四字為目又自注云絶不便為癃於此嘆識字之難依字當作麻説文麻疝類則是麻之名取義於腹痛故仲景亦以少腹弦急痛引臍中為正後世以其病狀淋瀝不宣遂借淋字為之詳泉所撰證原中釋疝説文疝腹中痛也釋名疝猶詵也氣詵詵上也然則腹氣逆上作痛者疝也許略而劉詳耳金匱寒疝正指此故次於腹滿下不與狐疝同篇其各條經文不涉及前陰一字隋巢元方知此義故病源載諸疝候亦無涉及前陰惟疝非前陰莖卵之病故女子亦得有之如素問厥疝外臺血疝石疝之屬是也疝以寒疝為正若狐疝㿗疝諸關前陰者特以其兼腹痛故以疝之名名之其不兼腹痛則直云陰縮陰㿗而已諸經中自有條理可尋也近世以狐疝為正疝遂不識金匱寒疝為何病而烏頭等方乃廢至張石頑醫通徐靈胎軌範皆合狐疝寒疝為一門矣而淺者又目為肝氣矣釋膈素問有隔傷寒論有格病源千金外臺有鬲音義皆相近而要非今之所謂膈也何以言之隔為不便經曰隔陽不便王注亦屢曰隔隔塞而不便寫也即仲景書之關元方書之內關外格也格為吐逆見傷寒平脈法王注素問亦用之義取格拒鬲為鬲氣其別有五其症不一不過寒食氣結所為皆與膈輕重懸殊治隔可利其二便治格可平其胃氣據仲景乾薑黃芩黃連人參湯症言治鬲可運其陽氣若今之所謂膈乃吳江徐氏所謂胃口枯稿不能受食者實噎與反胃之極境屬六極故多死無藥可治不得以鬲膈字同隔格膈音同而牽合之釋痰仲景書有濁唾有涎唾涎唾後人或稱淡唾淡言其薄以別於濁唾也淡字去水加疒即為痰巢源而下唾皆稱痰即於唾之不薄者亦稱痰不稱唾如凝唾謂之膠痰黏唾謂之膩痰皆與古書相戾也第古人名病必名其所可見薄唾稱淡有淡可見若無淡可見焉得冒淡之名因知金匱四飲中之痰飲雖本一作痰而走於腸間之水淡不淡尚未可卜仲景亦必不憑空名之淡飲之淡當為流字之誤走於腸間正謂其流與溢字懸字支字皆是狀其水行以為別水之行象必得此四者方備巢源論飲悉本金匱於四飲獨無淡飲有流飲所列流飲症狀正即金匱之淡飲隋時金匱不誤巢所據足為的證千金翼配入留飲為五次改懸飲為澼飲支飲為淡飲而於腸間動作有聲之飲亦作流飲與巢氏合緣流字似淡傳寫誤之尋又改為痰其迹顯然近有粗知訓詁者謂痰字從炎病必屬火依彼論治豈不大謬信乎辨之不可不審也釋散脈有左右如相低昂者謂之散如樹葉之動榆莢之落玉函聶聶如落榆莢者名曰散也八十一難作厭厭聶聶依義當作檿檿欇欇廣韻檿葉動貌欇樹葉動貌物輕而泛於水素問秋脈來急去散故曰浮又如物之浮曰肺死車行而望其蓋傷寒論脈藹藹如車蓋者名曰陽結也八十一難以為肺平脈其象莫不如是故歷擬之也左右如相低昂與數脈相似其實數之促急以徑言散之低昂以橫言數之促急起線散之仰昂不起線大不相同故言如數素問冬脈其去如數正謂散也示從容肝急沉散似腎又如物之浮是散之黏著而兼實者如車之蓋是散之有力而兼大者素問如物之浮如風吹毛成注傷寒論藹藹如車蓋者大而厭厭聶聶也故一為肺死脈一為陽結脈皆非散之正故仲景以如落榆莢為正又惟散之低昂以橫言故緊脈亦兼散象王注素示從容急緊而散曰肝惟散之低昂不起線故洪脈亦沿散名八十一難浮而大散者心也引而申之觸類而長之天下之能事畢矣釋毛古以毛為輕之譬詩大雅德輶如毛輶輕也孟子以一羽對百鈞又曰金重於羽漢書或重於泰山或輕於鴻毛皆言輕也脈以毛名者為其重按即無輕取則得也素玉機真臟秋脈者肺也故其氣來輕虛以浮來急去散故曰浮脈經肺脈來泛泛説文浮泛也則泛泛浮也而輕如微風吹鳥背上毛然則浮之輕而重按即無者乃為正毛脈矣其輕而不甚浮起或浮之輕而沉候又兼他象者只可謂之輕不得謂之毛脈經於吐衄曰脈來輕輕在肌肉此輕在中候故不云毛也於婦人妊娠曰按之則滑浮之則輕此以沉候有他象故亦不云毛也言輕不足以該浮言浮不足以該輕故傷寒論疊稱之曰毛浮釋代一古説脈代有數種素宣明五氣脾脈代注軟而弱也案軟弱則氣未盡暢有乍數乍疏之意此與靈邪氣臟腑病形黃者其脈代皆謂脾之平脈以脈經脾平脈長長而弱來疏去數參之則此所云代實即乍數乍疏之義蓋有數有疏則氣不調勻如相更代故曰代而古因謂不調之脈為代史記倉公傳和即經主病代則絡脈有過以代對和則代為不調可知素三部九候中部乍數乍疏者死其脈代而鉤者病在絡脈亦謂不調者為代承上句乍疏乍數而言意謂經代死終代病夏氣在絡長夏同法故脾以代為正此與倉公説皆取脾平脈之代而於非時妄見者射其主病也所以謂之代者取其變更不常如四時代更日月代明父子代嬗盛衰代遷之比説文代更也是也代之本義並不取乎止第以純軟弱則或不能行有疏數則似可得間間者止也不能行亦止也故古因又謂脈之有止者為代如經所云數動一代五十動一代乃代字之引伸義所以引代於止者即動以觀止則見為數即止以觀動則見為數仍是乍疏乍數之意也然猶通指一止者為代也至仲景而下別代於結始以動而中止不能自還為代之專稱矣至李時珍而下別代於促結始以止有常數為代之專稱矣於此見古今號之沿革釋代二脈經代脈來數中止不能自還因而復動此論最明來數數也中止疏也不能自還弱之甚也因而復動但弱無胃也與兩經之言若合符節於此知中止去軟弱止一間有胃氣為軟弱無胃氣即中止有胃氣則雖無力而其動猶覺不勻而勻故但謂之乍數乍疏無胃氣則雖有動而極無力以久持故謂之弱而乍數乍疏素玉機真臟真脾脈至弱而乍數乍疏其即脈經之所本乎素平人氣象長夏胃微軟弱曰平但代無胃曰死亦明以軟弱為有胃代為無胃且不云代而無胃必云但代無胃者以其但見軟弱中之疏數而無軟弱中之和氣故曰但代王注以軟而弱釋宣明篇之代而於但代直云動而中止不能自還義各允協又素脈要精微兩言代王注於數動一代云代止也於代則氣衰云動而中止不能自還亦切當其釋三部九候之代則過觀倉公傳自知總之釋脈必先明其字之本義及引申義而後前人之得失異同可考而知也釋鉤毛弦石溜五脈素五臟別鼓一陽曰鉤鼓一陰曰毛鼓陽勝急曰弦鼓陽至而絶曰石陰陽相過曰溜案一陽一陰謂一於陽一於陰也一與一通一專也夏陽大旺陰不能與之爭故曰一陽而鉤脈當之秋陽剝喪不能與陰爭則陰專故曰一陰而毛脈當之此二者言陰陽勝負之極也陽勝謂與陰爭而能勝陰也春時陽雖漸旺而尚為陰蒙故其象為急而弦脈當之陽至謂不能與陰爭故止曰至也冬時陰多陽少則陽沉潛故去來斷絶而石脈當之此二者言陰陽勝負之多少也溜脈不言鼓者以其弱甚也此陰陽之無勝負者也中氣也此經發明四時臟脈之義最精核曰一曰勝曰至曰過字字可求勝至二字義猶未了故足以曰急曰絶讀者所當緣文以求義也王注誤以一陽一陰牽合上文三焦與肝由此穿鑿附會頓失經旨致言臟脈者但知其當然不知其所以然矣釋㩌千金卷十三心臟篇云夏三月主心小腸病曰赤脈㩌㩌字經傳少見醫書僅見於此考禮中庸君子之道費而隱注費猶詭也道不費則仕釋文云本又作拂費字無詭訓原本必作拂拂之別體作㩌故又省作費若㩌省貝為拂則有手為費理固然也若經本作費鄭當破讀云費當為拂矣詩大雅皇矣四方以無拂禮大學是謂拂人之性箋注皆云拂猶㩌也與中庸注同可證也千金赤脈㩌云者謂邪氣㩌其脈氣也後人不知此義宋許叔微傷寒九十論引龐安常傷寒總病論赤脈攢攢即㩌之誤㩌語正本之千金而字誤作攢則不可通矣釋解㑊㑊字説文所無以食亦推之當為亦亦通於射古今人表曹嚴公亦姑師古曰即射姑也詩抑矧可射思射厭也然則解㑊云者謂懈怠而厭事也射又通於夜荀子勸學西方有木焉名曰夜干亦作射干左昭草五傳狐夜姑釋文本作射夜從亦省聲説文夜舍也天下休舍也然則解㑊云者謂懈怠而休舍也夜又通於液周有叔液鼎即八士之叔夜而周官考工弓人春液角近朱駿聲謂液解也然則解㑊云者即解字之重言也此王太僕寒不甚熱不甚弱不甚強不甚之訓所以不可易也又案食亦云者即臨食不甚喜好之稱故曰瘦人以其未食時若欲食及臨食則不甚欲食故曰善食而瘦人善讀如彼為善之之善兩症名義並同釋服一方之藥料古曰服今曰貼貼字古無止作帖説文帖帛書署也以木曰檢以帛曰帖案檢即簽也以檢類帖是帖即如今招貼之謂明帖即貼也文選陸機文賦或安帖而易施注公羊傳曰帖服也今公羊僖四年傳曰卒帖荊注怗服也字從立心疑即帖之訛然則帖與服義同爾貼占聲史平準書各以其物自古索隱自隱度也漢書注各隱度其財物多少而為名簿送之於官也由是推之則醫者隱度其藥物多少而為書署以豫人者宜其稱帖矣説文服用也呂覽論威敵已服矣注降也方藥稱服者言其用以降服病氣也降服之服同於伏而醫方有云一伏時三伏時者猶言盡此一時三時之候也藥物畏火煮爍故謂之伏猶秋之於夏以金續火名是時為三伏也學者果能隨處顧名思義則知古人牖我者至矣
