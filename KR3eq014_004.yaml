body:
  text: 卷四素問平人氣象闕文辨素問平人氣象於人以胃氣為本後獨言三陽之脈不及三陰林億以為闕文引難經呂廣説補之泉案三陰之脈行五臟經於三陽脈後即言五臟脈五臟即三陰也文與靈經脈六陽氣俱絶五陰氣俱絶及素經終六陽五陰之終例同蓋分手足言之則六陽渾舉之則三陽統言之則五臟稱五陰經實核之則五臟言各有當非一端也三陽主軀殼與脈經時脈之六經必兼三陰者相似而不同難經所言亦系時脈其動搖幾分云云不可執以例此五臟主軀內兼主時故五臟平脈與四時脈同然四時脈通主一身五臟脈專主一臟故病脈死脈之象則與玉機所云太過不及者不同讀靈素常須識此勿令誤也林校殊未審仲景法非北學辨仲景生於南陽官於長沙醫於京洛今案其地皆非北方郡縣而洛稱中土尤著仲景是書將為前聖集大成為後世立大法而斤斤一隅之見何以為仲景且歷東西晉南北朝及隋唐其間建都若鄴若金陵若長安幾於五方無定而外臺所採諸家半皆當時士大夫在京師者其尊仲景方至於天下響應及宋許白沙當南渡時去仲景千有餘年而傷寒九十論中所紀證治若合符節可見通人之學不以方隅限也其所謂傷寒病則惡寒體痛嘔逆而已並不大重何異之有若以其處方太峻則古權量不及今之十一有千金可證又何異之有夫天下事果有二千年來五方通行末幾而止宜一方者乎人亦自求所以知仲景者可耳按河南通志云張機涅陽人涅陽即南陽郡之屬縣名非有異也惟張松北見曹操以川中醫有仲景為誇見方氏條辨自序則與此異豈仲景曾入蜀為醫歟要之蜀亦西南方也金匱非論雜病書辨丹溪謂金匱為論雜病之書以示別於傷寒論似也抑知金匱即論傷寒中雜病非論一切雜病乎夫痙濕暍奔豚氣宿食嘔吐噦下利之為寒類仲景有明文百合狐惑陰陽毒之屬寒科千金有成例瘧癰咳心痛腹滿寒疝積聚水氣之挾寒見於靈素中風歷節心痹胸痹痰飲消渴黃疸驚悸吐衄下血瘀血轉筋狐疝之或由風或由寒詳於病源虛勞必助其陽肢腫必吐其痰蛔動必溫其胃可見也其尤著者中風宜若多端反取風寒濕雜至之痹為正下利宜若不一專以陽脈陽症為順肺萎上氣淋似乎熱矣而萎有甘草乾薑湯症上氣有半夏越婢湯症淋有弦急痛引症婦人病則尤雜矣則妊娠嘔吐産後三症皆從傷寒法治經水不論過期不及期並主溫經湯是皆以或純寒或兼寒者言也若臨症者泥此概施鮮不貽害作書之旨自為寒字窮其類耳勿執小異而疑大同仲景自名其書曰傷寒雜病論自敘其由曰宗族死傷寒故迄於隋唐總呼傷寒者以此自林億校成始與傷寒分而丹溪之説行近世又以其方論多倚溫熱不得其解則曰此北學也籲其蔽甚於丹溪矣兩濕溫不可合一辨難經濕溫言脈不言症脈經濕溫言症不言脈何也蓋在難經者既屬傷寒則必有頭痛發熱等症又以其脈陽濡弱也推得先受溫而尺熱口渴在其中陰小急也推得後受濕而身疼拘急在其中不言症而症可知已其與脈經所言先受濕後受熱者迥別後受濕者其濕浮於表與寒同法而減等小急者緊之減象也許叔微蒼朮白虎湯蒼朮散濕白虎治溫最合緣此濕溫重在溫也先受濕者其濕沉於裡與凡濕病同法故脛冷胸腹滿其脈當沉可以白虎概治之乎頭目痛妄言是濕甚於里將與後受之熱合化故禁汗之虛表以甚里蒼朮其可用乎緣此濕溫雖屬中暍重在濕也觀其所重兩者懸殊朱奉議見其名同而合之則奉議之不足與言傷寒也明矣三風溫準此溫瘧辨內經以先熱後寒為溫瘧與先寒後熱之寒瘧反對而以但熱不寒為疸瘧金匱疸溫二瘧皆但溫不寒注家不能分別泉謂瘧之命名本對溫而立冬感於寒及非時之溫至春發者其狀和順謂之溫夏感於暑及非時之寒至秋髮者其狀酷虐謂之瘧瘧有寒溫無寒先溫而感春寒則內熱為外寒所抑表實故無寒曰溫瘧者合二病以名之仲景書言溫言瘧則必言溫瘧立言之體宜然其與內經不同者內經主瘧仲景主溫也宜所言之同溫矣若疸則內經仲景皆主瘧宜所言之不同矣但此溫瘧者者字當作也與上文連讀謂疸溫二瘧並宜白虎加桂方也不然自鱉甲煎丸條以下皆方論並列何獨疸瘧條有論無方乎徐靈胎批金匱本亦云白虎加桂枝湯此溫瘧疸瘧之主方辨柔痙不惡寒之誤金匱痙篇太陽病發熱汗出而不惡寒者名曰柔痙脈經及成本傷寒同近嘉定黃鋐校脈經本云不惡寒一作惡寒案黃序於所言一作某者多據元泰定謝校本謝校本又多據宋熙凝林校本非不足據也明刻醫統正脈林校本有不字者傳寫誤衍幸病源傷寒痙候録柔痙亦無不字與元泰定本脈經同明王肯堂校千金翼卷九亦云不惡寒一作惡寒然則千金翼亦有無不字者巢孫二書多據金匱也金匱又云病者身熱足寒頸項強急惡寒時頭熱面赤目脈赤獨頭搖卒口噤背反張者痙病也彼經是釋痙病之綱特揭惡寒二字則知痙未有不惡寒者以經證經尤為可據蓋剛柔之分分於汗不分於惡寒也此一字所關非小不得不辨蛟龍病辨誤金匱果食菜谷禁忌云春秋二時龍帶精入芹菜中人偶食之為病發時手背腹滿痛不可忍名蛟龍病泉謂病得之誤食龍精與蛟無涉蛟當為咬字之誤在龍字下病名龍咬者以龍精入腹變生小龍咬人腸胃故腹滿痛不可忍方下云吐如蜥蠍可見龍精固能生子於腹中也作咬為是古咬字恆誤作蛟靈厥病云腸中有蟲瘕及蛟蛔皆不可取以小針心腹痛發作腫聚往來上下行痛有休止腹中熱喜渴涎出者是蛟蛔也今本發作憹作字下有痛字舛誤不可讀茲從脈經千金外臺引參正二蛟蛔字脈經千金外臺引皆作蛔咬而經誤且倒正與此同以蛟蛔證蛟龍尚何疑哉又案以夏小正鳴札之義例之則作咬龍亦可以先知其咬後知為龍也咬蛔仿此黃疸辨黃黃胖也疸五疸也金匱原有諸黃諸疸之別特疸詳而黃略讀者易混因誤認諸黃為即五疸中之黃疸耳考病源黃病候自黃病至治也百四十六字列症甚詳必本之金匱逸文何以言之一身盡疼發熱目澀鼻疼兩膊及項強腰背急乃太陽陽明表證而金匱有黃家脈浮當以汗解宜桂枝加黃耆湯一條證治相符大便澀正陽陽明胃家實症也而金匱有諸黃豬膏發煎主之一條證治相符金匱既詳其治不應反闕其證故疑巢説本金匱逸文且以此推之黃病固有與傷寒同法者故傷寒亦多病黃若五疸中之黃疸則與余疸同屬雜病自不若黃病初起可以傷寒法治之此其別也巢於黃病外別有黃疸與女勞疸酒疸谷疸黑疸同列而以靈素所言黃疸諸條及金匱所言疸而渴者以下三十五字入之黃疸候較之黃病論絶異其分別甚嚴真善讀仲景書者後人誤認金匱標目黃疸二字即五疸中黃疸因以篇中諸黃云云皆認為五疸中黃疸而黃與五疸之治法淆矣不效必曰古方難用也故讀書須取其至是者陰黃辨人但知黃疸之有陰陽而不知陰陽之何所指也一聞陰字即確認為虛症而不疑此不獨於疸為然而疸之害尤甚蓋疸本濕熱所為無問陰陽皆當以治濕熱為正的系陰黃則濕熱入深其候重於陽黃可知一投補劑收住濕熱當時雖瘥而病根終身不拔矣余見甚多而卒不可奪噫人亦思陰陽之論何自昉哉金匱云疸病發於陰部其人必嘔發於陽部其人振寒而發熱然則二疸之別別於症之淺深不別於氣之虛實陰以五臟言謂肺也陽以六經言謂三陽經也仲景書中固有此例如傷寒發熱惡寒發於陽無熱惡寒發於陰咽喉痛面赤有斑為陽毒面青身痛為陰毒皆是也後世不明此義每遇陰症之名不以為寒而用熱藥即以為虛而用補藥元明以來比比然矣景嶽於陰黃多制補劑其意豈欲誤人哉良由誤認一時之收住為功且速而不知能料他日復發之真明且遠也大學貴知至信然內風辨兩經無內風之名始見於史一百零五卷倉公傳脈來滑者為內風也一語蓋指外風之入內者不謂其自內出也千金方亦頗言內風細繹其指與倉公同惟王太僕素大奇腎風注云勞氣內蓄化而為風始以自內出者解經風字然究不言此風宜補也且素水熱穴原腎風明言汗出逢風是腎風何嘗非外入之風不必如王注所云矣近世內風之説盛行東南嘗以意別之乃中風痹痱及肝氣腎氣等症但本各有主名何庸易以混號且古人惟以中風諸症為外風入內故制諸續命湯加減之方以治之惟以肝氣諸症為臟氣之厥故制諸七氣湯加減之方以治之若概目為內風專為補計則續命不嫌於發散七氣不嫌於走泄乎夫古人立法每症皆有百世不易之準何獨風厥兩門乃至與後世大相刺謬如此耶噫異矣人迎氣口辨靈素動以人迎氣口對説而於終始篇專著太陰二字於脈口上太陰謂手太陰脈口即氣口其言曰人迎與太陰脈口俱盛四倍以上命曰關格此一語正以別人迎於氣口也王注知人迎之不屬太陰因以結喉旁脈當之蓋本素陰陽別三陽在頭三陰在手之論最的後人不知其所本粗讀古經轉駁王注為謬而創左人迎右氣口之説以為本之脈經豈知脈經關前一分人命之主左為人迎右為氣口四句一氣貫下與神門訣斷兩在關後相對則專謂關前一分之在左者為人迎故與關後一分之神門並論非統左三部言也平人迎條云左手寸口人迎以前脈實者陽實也等語與靈素所言迥殊細玩以前兩字自明脈經本不誤後人自誤會耳前人辨此者多茲不備引要惟楊上善太素注為獨勝焉千金辨誣千金卷二十六菜蔬類瓜子主治下云一名白瓜子即冬瓜子也白冬瓜子味甘微寒無毒除小腹水脹利小便止消渴莧菜實主治下云一名馬莧即馬齒莧菜也治反花瘡案此兩條當是北宋修者所改何以言之瓜子乃香瓜子其與冬瓜異物人人所知馬齒莧之於白莧菜亦然凡藥名以馬稱者皆言其大經以白莧為主而白莧大於粳莧故稱馬莧對粳莧之稱細莧言馬齒莧既非一物安得同條若以同條言之則是同物而馬齒莧之主治何以與白莧大殊乎孫系博學通人必不若是之謬緣宋以來皆誤認古人單稱瓜者為冬瓜又見其馬字從同遂以臆改陶注亦以馬莧為馬齒莧而辨其異猶無大誤嗚呼唐人舊説被後人竄易者可勝道哉君火相火辨火之稱君相也惟天有然而人則否何以言之素問説少陰君火主春分後六十日少陽相火主夏至前後六十日與厥陰風木太陰濕土等同為天之六氣六氣惟火暑為時最長故分其純者為君火烈者為相火相火亦謂之暑乃始溫終熱之義也故曰惟天有然至於人身則左腎水右腎火即為諸臟腑所秉氣液之源無一臟無水即無一臟無火本與六氣火暑之別於四氣者不同論其源委心亦資源於腎安得以心為火中之火而君之腎為水中之火而相之且心之為火腎之為水不過配合五行之位如此豈謂火結成心水結成腎乎心之稱君特十二官比例如此其為五臟之一則同然猶有經可據也至於腎之稱相並無所出尤不可也且五臟既皆有火除心為君外於分皆為相何得專以相之稱屬腎乎況心腎既皆有液則皆為水何以無君水相水之稱乎可見六元正紀之説斷斷不可移之人身者也此等混蒙話頭不可不闢不闢則道之真者不見相沿既久至有以欲火當相火者噫醫道之難言也昔徐靈胎曾著君火相火論專論腎火之不合稱相而其義猶未盡當又移六元正紀之説於人身者宋成聊攝已不免有之然其是非正不難辨若雲天之二火可移以論人則必手臂內側後廉及心臟皆專有溫氣手臂外側及三焦皆專有熱氣而可推之餘四氣將謂足經外側後廉及膀胱皆專有寒氣乎足經外側前廉皆專有燥氣乎其不可也明甚而承訛襲謬日以加劇蓋由內經之學淺嘗者多深思者少耳龍雷之火辨余素不信龍雷之火補陽則消之説後閲葉桂景嶽全書發揮本草正乃知有先我言之者矣其言曰今醫家每言龍雷之火得太陽一照火自消靡此言甚是悖理龍雷之起正當天令炎熱赤日酷烈之時未見天寒地凍陰晦凜冽而龍雷作者則知仍因陽亢而非熱藥所能治也若用熱藥乃戴陽格陽陰極似陽之症此處尚要講究明白按葉説甚當考龍火得水而燔遇濕而焰之説本始於王太僕素問至真要大論注不過藉以形大熱之氣不可以寒折之折之以寒而熱愈不得泄勢必鑠盡氣血而死注中所以有物究方止之喻也至真要篇前列六氣後列治法則此注當指感症言如傷寒在表身熱如灼反宜桂枝之熱不宜石膏之寒故經文此下有反治云云義止如此無俟深求今因葉説推原及之葉書系道光時其五世孫所刊者此言在第四卷中甘草粉蜜湯方白粉辨白粉説者謂即鉛白粉泉謂經處此方於已服毒藥後是因毒藥不效而改治若鉛白粉仍系毒藥何庸以毒繼毒乎蓋此方與傷寒少陰豬膚湯方皆粉蜜同用成注白粉益氣斷利明是米粉以彼例此義可知已考外臺治一切藥毒方甘草三兩炙以水五升煮取二升內粉一合更煎三兩沸內蜜半兩分服以定止千金翼治藥毒不止解煩悶方甘草二兩炙白梁粉一升蜜四兩煎服法與外臺同泉據此經為説粉為米粉無疑且經云毒藥不止者謂藥毒傷其胃氣故蛔動不止若作毒藥殺蟲解則豈甘草粉蜜之甘和功反過於毒藥而毒藥所不能殺者殺之以平藥乎必無此理仲景書文義簡奧有當即症求方者有當即方求症者余作此篇即方求症也金匱水莨菪辨水莨菪不見於他書本草經有莨菪云苦寒無毒通神見鬼多食令人狂走與此經大同其言無毒則反綱目直引此經於莨菪下意謂水莨菪即莨菪也但莨菪非菜類又希用仲景緣何慮其誤食李氏必誤考百一方云菜中有水莨葉圓而光生水旁有毒蟹多食之人誤食之狂亂如中風狀或吐血以甘草汁解之其論全據此經而云水莨是經文莨讀如艮卦之艮菪字衍也水茛似水堇堇為菜屬故云菜中有水茛以其似堇故著誤食之戒百一所據當不誤且經於上節言鉤吻似芹誤食殺人説者謂鉤物似毛茛此節光茛正與上反皆為食芹者辨其似下節言蛟龍病又為食芹者潔其治數節皆特明芹之禁忌則非茛菪明矣此種亟當削正而自明已然無人議及於此嘆讀書之難常蜀截瘧辨古治中暑用腦麝而治瘧用常蜀法異意同何以言之無形之暑氣痹著膈間蒸痰結固既非表寒可汗又非裡實可下必須氣烈開提之藥直達病所追逐其痰斯無形者失所恃而去瘧須常蜀猶暑須腦麝也但淺深之別各有宜耳今治中暑尚知遵古獨於常蜀僉謂其截瘧釀變然余目驗蘇州吳江震澤等處其俗呼常山為甜茶遇瘧發輒採鮮者一大把煎服皆輕者止重者減未聞有止後變生者余踵用其法亦然夫截之為言堵塞也藥之能堵截病由者必其性澀壅足以遏住經絡斯留邪而釀變非常蜀開提之性所及也為斯説者盍觀外臺聖濟各集漢魏以來千餘年諸治瘧名方几千首而用常蜀者十之八九癟螺痧辨光緒紀元之十一年夏秋有疫盛行於大江之南其症惡寒四逆頭疼體酸短氣汗出或吐瀉湖中死者日數十人人以其指頭之肌之陷也謂之曰癟螺痧又以其半日輒死也亦曰六時痧曰子午痧嗣後間數歲或一歲輒復行至今十年未已客有問余者曰何氣使然也古人亦言之否笑應之曰天止六淫人止五志病雖百變不出兩端自仲景著論而後至於唐宋而降治法備矣循途守轍弗之有誤醫者之能事畢矣然而人以為數見不鮮也其黠者因摘古人之所略矜言創穫以新一時之耳目故於熱病必稱白㾦曰此古書所無也於喉風必稱白喉曰此古書所無也如此方可動人聽聞把持由我而其術易行嗚呼巧則巧矣抑思其所用方果能外古人治熱病與喉症之方乎吾知其名可改其法不可改也今癟螺痧即暑月之中寒耳其吐瀉者即霍亂耳其正名自在古人論中所傳治癟螺痧十餘味一方及雷公散皆古人治霍亂及暑月中寒之常法何奇之有吾子徒受人愚耳每見虛弱人手浸冷水久或猝遇大冰雪皆令螺癟何獨為痧異其痧而死也死於汗死於瀉非死於癟螺不死於癟螺即不言癟螺也可駁元陰近徐靈胎砭趙養葵之改太極也曰人身有元陽無元陰大哉言矣人身如天地元陽猶易之太極元陽動而為陽靜而為陰猶兩儀也惟元陽動而為陽之陽方可以陰字對之若元陽則無可與匹者安得有元陰夫元陽所息曰陽所消曰陰陽者揚也言元陽所發揚也陰者隱也言元陽所隱藏也不觀之十二闢卦乎息則為陽爻消則為陰爻陽爻作一象元陽之實之也陰爻作一象元陽不在而位虛也貴陽賤陰職是之故故謂人身有陰則可謂人身有元陰則不可至於治病亦一以元陽為主元陽虛則培之亢則抑之明乎此義而陰陽二字始得其解吾於國朝諸醫不能不推尊洄溪一老駁吳喻二家説溫疫之非泉昔著溫疫説以證其自時氣來復慨吳又可喻嘉言之惑人也而為此駁吳喻之言曰溫疫感受異於傷寒異於溫熱又異於非時寒疫是天地間另有一種戾氣為之夫謂溫疫異於傷寒溫熱與傷寒例合可謂溫疫異於非時寒疫與例不合而合猶可例文以溫疫即寒疫之變至謂另有一種厲氣則例無此文不可天地間止有六氣其厚者即為厲氣厲氣有毒毒者厚也此外果有另一種氣可與並列為七何以軒岐鵲景如此神聖而無一字及之原大兵荒後所以有疫者非謂人尸混處之故以人憂勞倍苦則正氣倍虛非時之氣易入而為病易深耳要其所感之氣仍是六氣天何嘗特設另一種厲氣以困此身遭兵荒者乎吳喻不解例意妄斥叔和豈知仲景書賴叔和存無叔和即無仲景也駁臨證指南二條葉氏桂臨證指南一書於溫熱脾胃最精似可為初學法然其可議者不少如溫熱類以神昏為心包絡病考古説神昏屬陽明見於素脈解厥逆及金匱中風等篇而靈經脈篇釋心包絡經是動所生病無神昏不知人之説則葉氏之於經學可知也脾胃類則雲陽明陽土得陰始安太陰陰土得陽始運夫以陰療陽以陽療陰似也但胃若虛自宜以陽藥培之仲景於傷寒下後諸治皆用乾薑義可見也脾若虛自宜以陰藥培之仲景於亡津諸治皆用人參義可見也自難執一而論此二條皆徐靈胎所未及駁者而誤人也亦不淺十三科考十三科有兩説大方家説寒一內二喉三目四瘍五傷六金鏃七女八兒九痘疹十針灸十一祝由十二符禁十三明王肯堂證治準繩近王晉三古方選注皆如此祝由家説並符禁於祝由另立風科以足其數考祝由無不用符禁者符禁安得別為一科中風之病千頭萬緒自應另立不可與內科混且內科者主飲食起居房室情志之病而中風之邪自外致不自內生不得屬之內科史扁鵲傳扁鵲至洛陽貴小兒即為小兒醫至邯鄲貴婦即為帶下醫至周貴老人即為耳目痹醫夫耳目痹醫即風科也則風科之自為一科也由來舊矣金匱馬刀考注家皆謂馬刀為瘡形長如馬刀蛤然經文與俠纓對舉俠纓以部位名而馬刀以形似名儷語不類馬刀當亦部位之名與俠纓相近大約是頸側䐃肉在耳之下而略近於後下當肩井之上揣之曲肖馬刀者頸側䐃肉之名馬刀猶掌側白肉之名魚乎取於物為假亦古命名之例夫生於俠纓之處曰俠纓則生於馬刀之處曰馬刀經之對舉義當如此千金九瘻篇以馬刀瘻馬刀肩腫二症與掖下腫吻傷四肢不舉喉痹天牖中腫等作一例文法掖下吻肢等既是部位則馬刀可推其尤著者馬刀肩腫四字謂馬刀與肩俱腫也以千金證金匱決然已若瘡形之長者則與圓者何別而必提出言之且俠纓之瘡未必無長頸掖之瘡未必盡長又何以別之詳經意不問長否苟生於頸側䐃肉間總謂之馬刀而已矣此篇專明金匱之馬刀若執是以概近世方書則否願用近世書者勿引金匱也自記命門考難經左為腎右為命門命門者精神之所舍原氣之所繫也男子以藏精女子以系胞案銅人任脈有石門穴一名精路一名命門一名丹田在臍下二寸三焦募也其旁有足少陰四滿二穴一名髓府去腹中行一寸足少陰衝脈之會是男子之精藏於臍下二寸也又關元在臍下三寸左為胞門右為子戶去腹中行二寸五分為足少陰衝脈之會病源三十八胞門子戶主子精神氣所出入合於中黃門玉門四邊主持關元禁閉子精關元主藏魂魄婦人之胞三焦之府常所從止是婦人之胞系於臍下三寸也以此推之精宮高於胞宮一寸非同一穴且命門在十四椎下去二穴遠當是難經混稱之故耳其稱命門者名同實異也男子精自石門離宮至橫骨約四寸而出於玉莖能射者為有力不能射者為無力其與女子交則莖頭當女子中極之下龍門之次其瀉精正當關元旁當胞門子戶故病源有胞門子戶不受男精之論千金云進火之時當至陰節間而止外臺云下精時入玉門半寸許為佳此莖頭當龍門之證胞門龍門玉門考脈經帶下有三門已産屬胞門未産屬龍門未嫁屬玉門案已産之帶由胎育來其屬胞門易曉若未産即已嫁其帶應由房室來而屬龍門未嫁之帶應由邪思來而屬玉門何故考胞門在關元旁去臍三寸再下一寸為中極一名玉泉其下有龍門穴內當交骨孔中千金云龍門在玉泉下女子入陰內外際翼云龍門是陰中上外際是也女子傷於丈夫之病多在龍門何以言之千金云進火之時當至陰節間而止蓋謂陰內交骨節間也外臺云下精時入玉門半寸許為佳蓋玉門內半寸許正當交骨孔間與男子交時龍門以屢開而傷故已嫁之帶屬此玉門即陰門在交骨間無穴若未嫁龍門尚未經開其因邪思而致營熱者止為病在經絡玉門亦經絡外候故未嫁之帶屬此脈經分別絶精又案病源云胞門子戶主子精神氣所出入合於中黃門玉門四邊主持關元禁閉子精彼論三門淺深同此則黃門當即龍門以穴言稱龍門以門言稱黃門各有當也妊娠為夫所動則龍門傷不能持關元即致胎墮故千金外臺諸書治胎落有灸龍門者白虎病考唐宋人論白虎病證治不一猝不易曉以泉考之其別有三一為年神病源卷四十八云太歲在卯即白虎在寅準此推之知其神所在小兒有居處觸犯此神者便能為病其狀身微熱有時啼喚有時身小冷屈指如數似風癇但手足不瘛瘲耳又外臺卷十三蘇孝澄云白虎病婦人因産犯白虎丈夫因眠臥犯白虎其病口噤手拳氣不出是也一為糞神證類本草云白虎鬼古人言如貓在糞堆中亦云是糞神今時掃糞莫置門下令人病此陳藏器云治法以雞子揩病者痛處咒願送著糞堆頭上勿反顧不過三次瘥白虎是糞神愛吃雞子也是也今湖俗名此曰送客人但古為白虎設今則沿用而忘所自耳一為歷節風以其百節皆痛晝差夜劇如虎之齧故名亦見外臺近世謂之白虎歷節治屬風家白虎病須別此三者斯知古論有條不紊羊脛骨考宋朱端章衛生家寶産科備要方卷七追命散方治婦人血症方中有羊脛炭云即炭中圓細緊實如羊脛骨者取三四寸卻作十餘段別以著灰同燒通紅淬入醇酒中如此七遍烘乾為末半兩案綱目炭火羊脛骨下皆不載此方獨蘇沈良方小兒吞鐵方剝新炭皮為末調粥服炭屑裹鐵而下云云與談野翁方誤吞銅鐵以羊脛骨燒灰煮稀粥食神效云云正合而綱目卷五十二採談方乃入羊部不云即炭他書亦未有言羊脛骨如朱説者則訛以傳訛久矣四十難義疏四十難肝主色心主臭脾主味肺主聲腎主液其義難明泉擬為之疏曰氣之蘊藉而徵者為色其發越而透者為臭其搏擊而出者為聲其團聚而流者為液陽氣者升於東升者陽之始也尚被陰蒙不得遽出蘊藉於中而徵中外則為色東位肝故肝主色陽氣者極於南極者陽之泄也盛陽充滿發越於上而為臭南位心故心主臭陽氣者衰於西陽消則陰長陽不勝陰反受其爍則震蕩而不靖於是乎有聲西位肺故肺主聲陽氣者伏於北伏者團聚而不散則釀之蒸之而液生焉北位腎故腎主液陽氣者和於中央和者陰陽平陽主氣陰主質氣與質合而味生焉中央位脾故脾主味五主之義如此訂正素問通評虛實論經文並補注所謂重實者言大熱病氣實脈滿是謂重實尺膚候周身之寒熱今云大熱病則尺實可知故下文重虛一段以尺虛對説經絡皆實者是脈急而尺緩也今本脈急作寸脈急案注脈急謂脈口急也是王本原無寸字脈謂脈口統三部言尺謂尺膚候經在脈口候絡在尺膚後人誤以尺緩為切法因別脈急為寸脈急而衍寸字若經本有之注不得截去之絡氣不足經氣有餘者脈熱而尺寒也秋冬為逆春夏為從經虛絡滿者尺熱滿脈寒澀也此春夏死秋冬生也今本脈熱脈寒澀脈下皆有口字蓋涉注中脈口熱脈口寒而誤衍今從脈經削正上文脈急而尺緩也亦無口字何謂重虛脈虛氣虛尺虛是謂重虛今本脈虛氣虛作脈氣上虛今從林校正案重虛即重實之反則當脈症亦反脈虛反上脈滿氣虛反上氣實尺虛反上大熱病以尺虛則身無大熱可知也王注言尺寸俱虛詳其詞旨正釋脈虛尺虛則王本原不誤所謂氣虛者言無常也注寸虛則脈動無常寸字乃氣之誤氣為脈氣明經文脈虛之脈專謂寸口尺虛之尺專謂尺膚而氣虛之氣則統謂尺寸運行之氣義深且當楊上善以膻中不足釋氣虛終不若王氏之精也此注與上注尺寸俱虛相印欲人互推以見義寫者誤氣作寸則難通矣易一字義了尺虛者行步恇然行步恇然者寒懍不能自持之狀蓋尺膚本候周身尺虛則必身寒與上文重實之大熱反對緣經不質言而形容之故淺人不得耳今因注略故補明之脈虛者不象陰也注不象太陰之候也何以言之氣口者脈之要會手太陰之動也詳王意讀象為像易云象也者像此者也寒氣暴上脈滿而實實而滑則生實而逆則死實謂氣實也寒氣暴上則尺虛可知上文重實重虛二端謂尺氣脈三者之各極一偏者此節謂氣脈二者如上重實而尺獨異者脈實滿手足寒頭熱春秋則生冬夏則死此節承上脈滿實而言其有寒有熱者其形盡滿者脈急大堅尺澀而不應也如是者從則生逆則死所謂從者手足溫也所謂逆者手足寒也此氣實而脈虛尺虛者此經明言尺澀而以從逆並言見尺澀亦有手足溫者可證上文手足寒為氣虛非尺虛而脈實滿頭熱為脈實尺實也消疸脈實大病久不可治脈懸小堅病久不可治今本脈實大病久下無不字詳注云久病氣血衰脈不當實大故不可治是王本原有不字巢氏病源云消疸之脈實牢大者死細小浮者死巢説正據此經而云實牢大云細小浮則經堅字當在大字上無疑且經文是帝問消疸虛實則岐伯當明實脈虛脈以對之實堅大是實懸小正是虛問答相符不當反列堅字於懸小致令虛實相亂浮即懸牢即堅校正靈樞經脈篇經文起於大指次指之端脈經此下有外側二字案經於諸指端皆不言何側然以穴求之則脈經亦得入肘下廉脈經入上有上字兩通下作外案陽明行身之前不應入肘下廉本經肘髎穴正當肘外廉不在下廉當從脈經改正從缺盆上頸貫頰脈經盆下有直入二字案經於脈之從此伏行者通謂之入本經自巨骨至天鼎無穴明系缺盆上頸之次是伏行也若如今本似缺盆以前浮行而上頸於經隧穴道不合入下齒中脈經齒下有縫字馬注及卷三寒熱篇注引皆同是明時經文尚不誤頸腫脈經頸作䪼案素至真要大論少陰在泉民病齒痛䪼腫新校正引甲乙經亦作䪼蓋目下曰䪼本經脈挾鼻孔正當目下故有䪼腫一症若缺盆上頸之次脈已伏行不得復有腫症起於鼻之交頞中素五臟生成平人氣象注兩引皆無之字案有之字則似交頞二字為脈次之名詳馬注云起於鼻之兩旁迎香穴上行而左右相交於頞中則經原不衍上入齒中脈經作入上齒中與手陽明入下齒中相對案上齒屬足陽明下齒屬手陽明經有明文若混言齒中則上下莫辨且本經自鼻至齒至口明系下行何得云上入起於胃口下循腹裡脈經口字在下字之下素五臟生成注引同馬注亦云起胃下口循腹裡則經本不誤傳寫倒之以下髀關王注素五臟生成篇引無關字下廉三寸而別下入中指外間脈經廉作膝別下有以字案本經自中指內間分支至外間不得云下廉馬注正作下膝則經文本不誤蓋上一支入膝臏中此支不入臏中而從膝浮行下三寸而別也以字依此篇通例應有善呻數欠脈經呻作伸蓋以善伸數欠為一症也禮記云君子欠伸若呻為腎病不應屬胃則惡人與火素脈解及陽明脈解則下皆有厥字義長當補心欲動獨閉戶塞牖而處脈經欲字在動下屬為句無塞字素陽明脈解同蓋古本靈樞如是且脈解不釋心動二字是上屬驚字為説甚素脈解於病至作甚甚作病至與此互異釋經文當從脈解改正蓋閉戶牖以上為衛氣自虛之症上高以下為衛氣大實之症實者病也如今本則不可通口喎唇疹脈經疹作緊案口喎屬筋病與脈病不幹喎當為瘑謂口生瘑瘡與唇疹同為瘍症喎本俗書古無口旁此經原文必作咼蓋即瘑之省淺人誤認之耳緊即瘕之假謂唇瘡疹緊兩通詳余所撰證原中大腹水腫案此經皆論症狀不及病因何獨於此言水腫也素脈解云所謂客孫絡則頭痛鼻鼽腹腫者陽明並於上上者則其孫絡太陰也故頭痛鼻鼽腹腫也彼文是釋大腹腫而無水字亦可見此經衍也寫者以水氣門中有大腹水腫之名因致舉燭之誤得後與氣則快然如衰脈經作得酸與熱則快然而食泉案後與酸偏旁相似氣或作氣與熱相似衰與食下截相似故致抵牾心下急痛脈經此下有寒瘧二字疑衍不能臥脈經作好臥不能食肉唇青八字案胃病則不能臥脾病則好臥以此論之脈經是也余義未詳股膝內腫脈經腫作痛義長案腫衛病痛榮病所生病下不應錯出衛病之症當從脈經改正出肘內側兩筋之間脈經筋作骨入缺盆脈經此下有向腋二字義匝頰腫頸頷肩臑肘臂外後廉痛脈經頰腫頸頷四字作䪼頷腫頸案脈經之文合於脈道行次當補䪼字改頷字下挾脊貫臀脈經作下會於後陰下貫臀案本經所生病中有痔痔為後陰病經有生於後之陰症必有會於後陰之脈本篇云足太陽之正其一道下尻五寸別入於肛與脈經文合此經不應脫去此脈當從脈經改正頭囟項痛脈經囟作腦項作頂案以本經從巔入絡腦論之脈經義長如馬本則項痛一症與下復非也氣不足則善恐素脈解作少氣善怒是氣不足與善恐當平列則字衍也自飢不欲食以下至此皆為氣不足所生何獨一善恐也當從脈解削正是為骨厥脈經骨作腎循胸中脈經無中字案本篇通例凡言循者皆系浮行之脈若胸中則為脈道伏行之次當注云若入不當云循也經無中字顯然馬注亦無中字布膻中脈經布作交案馬注亦作交則經本不誤否則上言布下言散豈不義復以屈下頰至䪼脈經頰作額案本經從耳上角而下自額至䪼其勢順自頰至䪼其勢逆且經果有此回繞之脈亦當云以屈下頰復上䪼不得如是立文也急當從脈經改正下大迎合手少陽抵於䪼脈經引此有二文一作上迎手少陽於巔一本與此同但無抵字案馬注亦無抵字則經本不衍當削正至上迎手少陽於巔揆之穴道甚合蓋在陽白眼隼目窗正營承靈腦空之次於馬本較備必當從脈經改正入小指次指之間脈經間作端義長蓋小指次指即無名指非是兩指不當云間還貫爪甲出三毛脈經貫下有入字案三毛無義依足厥陰經經文當為叢毛頷痛脈經作角額痛袁校本作頭角痛額痛案本經自頰車下頸不及頷不當有頷痛一症其支脈自目兌眥上迎手少陽於巔必過額無疑應有額痛一症脈經義長至頭角痛三字即上頭痛二字之異文但三陽惟太陽居頭之正得專稱頭痛少陽止經頭角自當雲頭角痛不當混言頭痛也循股陰入毛中脈經陰字在入字下案本篇之例或曰前廉後廉或曰內側外側內廉外廉從無以陰陽立名者依例當云循股內廉以上文已云上膕內廉故省其文曰循股當從脈經更正則津液去皮節津液去皮節者則爪枯毛折毛折者則毛先死難經則津液去句皮節津液去皮節者八字作津液去則皮節傷皮節傷者十一字脈經同爪字難經作皮脈經與經同毛先死難經與經同脈經作氣先死案津液去皮節無義難經為長若爪則足厥陰之候非手太陰之候不當列此即難經皮字亦與上皮傷義復以經文單承毛折二字推之爪枯二字當為衍文毛先死與毛折義復以下四段經文例之則作氣先死為的且與上氣不榮則皮毛焦允協又案上文已云皮毛焦此文復云皮節傷何於皮獨詳也古人恐無此重復文法皮節當為肢節之誤肢古或作支與皮形似故誤則脈不通脈不通則血不流血不流則髦色不澤故其面黑如漆柴者脈經則脈不通四字下有少陰者心脈也心者脈之合也十二字難經與經同難經髦色不澤作色澤去無髦字案以上下四節經文例之則十二字當有此十二字是釋經文以脈不通候少陰氣絶之故無者傳寫脫之耳髦字衍素六節臟象論云心其華在面其充在血脈是候心者當在面與脈色不澤謂面色黑與故字緊接下若有髦字則謂髦發之枯非謂面色之黑矣故其以下八字接得上否且髦為手太陰之候何得列此則脈不榮肌肉唇舌者難經脈經並作則脈不榮其口唇者義長如馬本則上下皆不圓且舌為足厥陰之候非足太陰之候自是口字之誤則舌萎難經脈經並無舌萎二字案當從彼削正義見前故骨不濡則肉不能著也脈經著下有骨字案難經云肉不著骨是經文固有骨字則筋絶脈經絶作縮義長聚於陰氣而脈絡於舌本也難經脈經氣並作器王注素診要經終論引亦同難經無脈字義長則筋急筋急則引舌與卵故唇青脈經急上並有縮字難經同義長難經無唇青二字案唇為足太陰之候非足厥陰之候雖青色屬厥陰而此篇通例皆紀經不紀色其為衍文無疑起於腕上分間並太陰之經脈經腕上作腋下間字下有別走陽明其支者七字案列缺穴在腕間寸半不在腋下疑脈經誤意者其正絡出腋下其支絡之直入掌中散入於魚際者乃為列缺歟然魚際與列缺位不相當闕疑可也案以他絡例之別走太陰當從脈經次於此取之去腕半寸別走陽明也脈經半寸作一寸半無別走陽明也五字案考古針灸家説列缺穴在腕間寸半於此知經文誤倒也當從脈經改正脈經別走陽明在腕上分間下故於此無之虛則為頭強脈經頭強作煩心案手心主脈並無至頭者不得有頭強一症且頭強是項筋所生當屬足太陽列此非也若煩心則於經絡心系三字允協當從脈經改正去內踝五寸脈經踝下有上字案據馬注則經文本有上字今本傳寫脫之耳實則挺長脈經長下有熱字義長讀經脈篇書後此篇書例以經所從始曰起以連本經之臟腑者曰屬以本經縈相表裡之臟腑者曰絡由此適彼曰循自下而上曰上自上而下曰下過乎他經曰行過乎肢節之旁曰過穿乎其中曰貫並乎兩旁曰挾彼此相互曰交巡繞四邊曰環直達其所曰抵自外至里曰入本隱忽見曰出直行曰直平行曰橫半橫曰斜兩支相併曰合一支而歧曰別疾行往聚曰趣去此復回曰還內經中句斟字酌無過此篇倣佛禹貢山脈水道書例惜乎馬元臺輩未能一一注明也且此篇與經筋衛氣營氣及素問所載陰陽大論諸篇皆古之奇文當熟讀而精通之而此篇敘營衛各病之原尤切要故既校其文復書其書例於後讀仲景書書後讀仲景書而窮源於靈樞素問人知之讀仲景書當竟委於千金外臺人不知蓋千金外臺之視若僻書也久矣抑思仲景之書其文簡其義隱其症略其方約其藥省除傷寒桂枝麻黃柴胡四逆等湯症反復辨論外大抵為後學發凡起例未暇致詳墨守其書無益也惟千金外臺兩書根柢仲景而推衍之集九代之精華成千秋之巨制元關祕鑰發泄無遺若能從此上溯而於其參互合併釐析移易變通脫化之處以意逆志斯仲景之症類賅方用神藥例見久之可以窺其堂奧矣況有逸論逸方足補王林王王洙林林億俱北宋人之本缺古説古義堪砭成趙成成無己宋人趙趙良元人之傳訛學者舍是其何以問南陽之津哉夫儒家文宗韓柳詩宗李杜經義宗陸孔書法宗歐柳皆唐法也則唐人之守先傳後可知也惟醫亦然傷寒論跋仲景書之以傷寒名也仲景自題之仲景書之為傷寒作也仲景自序之而議者必曰此兼論溫熱也何以其書於大書中風傷寒風溫三條外但屢言中風若何傷寒若何不更言溫病若何熱病若何耶是明明為傷寒盡其變而特以風溫備其例如泉前篇所云也議者又執書中有治熱方以為難夫驟而觀之寒藥誠若與寒病乖第思寒之直中於里可暖之以辛附寒之甫受於表可宣之以麻桂若寒已入里化熱而後既格於辛附之暖又礙於麻桂之宣則舍膏知芩連將何所用此時之不得不與溫熱同治者勢也而所治之病仍從傷寒來不自溫熱來夫傷寒與溫熱之始異終同譬如風寒本異自一過少陽則概從柴胡論治更無區別倘於斯時指之曰風本與寒同一法也其為講傷寒者所許乎故謂仲景方可治溫熱則是謂仲景書兼論溫熱則非夫兩間藥物止有此數傷寒已成裡熱固宜涼平溫病苟挾表寒亦資溫散圓機活相非可以口舌論也傷寒論例跋仲景列四溫脈法外於冬溫則僅舉其氣濕溫則並無其目者以仲景書以傷寒名必溫之兼寒者始論及之若冬溫則但溫無寒濕溫則兼濕而非寒例不得入此書故不論及其痓濕暍篇之濕雖自濕來要與濕溫全不相似濕溫脈證自在難經脈經中不可混指也且仲景於濕已明云與傷寒相似故此及之相似者謂其體痛也其篇首又云宜應別論以明其體例之不雜可謂嚴矣安得以濕當濕溫強配難經傷寒有五之言乎又論文於四溫前云冬溫復有先後更相重沓亦有輕重為治不同證如後章而於四溫後云以此冬傷於寒變為溫病病之傳變方治如説兩文驟若抵牾必如余説方合蓋冬溫所以受而不發者亦以其有正氣之寒束之故也靈素止有冬傷於寒之溫而無冬中於溫之溫正以後束之寒統於專受之寒詞雖融渾而義特引申學者必知此而後仲景此文及病源千金外臺諸言春溫者始一一瞭然矣傷寒論痓濕暍篇跋仲景以風濕寒暑四氣為感症之大數既自以傷寒著其論以名其書而不辨夫風濕暑之為病若何即無以明己之獨為傷寒設於是又出類傷寒之論首列痓次濕次暍若恪循風濕暑之序而匯為一篇其所謂痓者即風家之專病也千金云太陽中風重感寒濕則為痓於此知痓病雖有自傷寒變來者要自有其正主推之濕暍義亦復然所謂與傷寒相似者謂其形證之似非謂其感受之似也其形證之似則痓之惡寒濕之體痛暍之惡寒發熱是也此篇之旨與平霍亂平嘔噦等篇不同彼數篇所列之病雖亦各有正主第正主之初起絶不似乎傷寒且凡風濕寒暑四氣所致皆得有之故但擇其關於寒者為論以盡寒病之發不必皆始於惡寒發熱也其始於惡寒發熱若痓濕暍三者反不自傷寒來則各列正病區而別之曰太陽所致痓濕暍三者宜應別論夫曰應別則傷寒論之專為寒因可知已向嘗謂仲景為寒因盡其變者以此傷寒論太陽篇跋傷寒論太陽篇大書寒因三條先中風者是於有寒有熱之邪據其一端言次傷寒者以寒之正言終溫者則以熱而兼寒之病就其所兼言寒因必列此三者而始備溫與風溫雖殊其為不即發而名溫則不殊故合為一條而統冠之以太陽病太陽病則頭項強痛矣以其因寒乃發故有此證其文法先言溫而後以風溫隸焉何等謹嚴夫熱而兼寒自當以溫為主不以所兼為主故但列脈症於此以後更不言溫病若何風溫若何如中風傷寒之必屢屢言之也義例自分軒輊不得執是而謂其兼論溫熱也若中濕之體痛中熱之惡寒則皆以其形似傷寒而因於濕因於熱皆非寒也與大書之三條懸絶故另出辨之不與中風傷寒溫病同篇觀其分合可知其指矣或據難經傷寒有五之文派入此書遂以濕溫當中濕而不顧陽濡而弱陰小而急之脈與沉而細者不合以熱病當中熱而不顧陰陽俱浮浮之而滑沉之散澀之脈與若微弱若弦細若遲者不合豈知難經是約舉其類配合成論視專為寒因盡其變者其精粗不可同日語乎讀金匱書後仲景著傷寒雜病論十六卷以明傷寒初起及傷寒雜出之病後人寶藏之改題曰金匱玉函方是以外臺引之概稱張仲景傷寒論於原書摘稱二字者猶肘後備急單稱肘後亦引證家之一例證類本草引之概稱金匱玉函方一從其初一從其後也當時以十六卷文繁而有刪本二其一就原書逐篇刪存要略併為三卷題曰金匱玉函要略方後為仁宗時王洙所得其一就原書刪雜病以下等卷存脈法六經及治法諸可不可等十卷題曰傷寒論而削雜病二字即今本傷寒論也此書行而刪余之卷亡十六卷原書不可得見矣故林序云張仲景為傷寒論合十六卷今世但傳傷寒論十卷雜病未見其書也林氏又以傷寒論十卷校金匱玉函要略方知其上卷傷寒文多節略至中下卷雜病及方療婦人無本可校雖有節略不能的知以脈經卷七八九校之知其是節略斷去上卷分中下二卷為三卷改題曰金匱方論即今本金匱要略也自是以來不可復合矣籲唐宋人於仲景書任意分並其不絶僅如線耳近又移第其文以就己意考古者宜何如珍惜也
