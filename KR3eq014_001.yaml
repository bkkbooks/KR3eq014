body:
  text: 卷一原因百病之因有八一邪氣二水濕三鬼神四蟲獸五器物六飲食七藥石八人事前五者在身外後三者在身內而八綱之中各有數目邪氣之屬有風日霧瘴有寒暑水濕之屬有露雨有水鬼神之屬有衝擊有喪尸有精魅有禍祟蟲獸之屬有咬螫有影射有遺毒有觸氣器物之屬有金鏃有打壓有觸傷有湯火飲食之屬有禁忌有過多有五味所傷有中毒藥石之屬有服藥過劑有藥誤石毒鴉片人事之屬有喜憂欲恚恐有行立坐臥舉重閃挫墮墜跌僕總計其目二十有餘擬引古論衍成一卷而未遑也略序於此原賊邪賊邪者太一沖方之氣因太一之氣不能自旺而來也自太一言之曰虛風自沖方言曰之賊風自受於人言之曰虛邪亦曰賊邪經云邪氣者虛邪之賊傷人也是也病源云冬至之日有風從南方來曰賊風以此推之則春分西風夏至北風秋分東風季春西北風季夏東北風季秋東南風季冬西南風皆賊風也其法不取五行生剋而用八方對衝一九相對故子午沖而寒熱可以互勝凡熱極反寒寒極反熱之病準此三七相對故卯酉沖而溫涼可以互勝二八四六相對二坤熱土八艮寒土四巽溫土六乾涼土坤巽得溫熱之氣則皆濕土艮乾得寒涼之氣則皆燥土濕土漸於辰旺於未燥土漸於戌旺於醜故辰戌丑未沖而燥濕可以互勝靈九宮八風篇文及素委和之紀眚於三五段及乙丑乙未歲災七宮十五段文義蓋如此其原出於九疇八卦也原風濕漢鄭康成注書洪範曰風中央土氣此言最的土旺四時故春溫夏熱長夏濕秋燥冬寒之氣皆於風見之以五行言曰五氣以六元言曰六氣以四時言曰四氣以五方言曰五風以八方言曰八風自其偏勝者言曰五邪自六氣之偏勝者言曰六淫皆此一風乃天地所以生萬物長萬物茂萬物收萬物藏萬物者也此氣失和則病萬物而又徹乎四時故經曰風者百病之長也以其氣散發故經又以風為木氣而屬之春猶濕亦為土氣而經或屬之秋也夫濕有數種第古人於水土之蒸氣正謂之濕而五行之濕統於風水穀之濕直雲水若飲分別綦嚴近世概以濕目之然古人治濕之方不可以治今之所謂濕也原榮衛人有三氣衛氣出於上焦據素問注榮氣出於中焦二者皆氣也二氣合行於心肺之間則積而為宗氣本無形質必有所附麗以行故榮行脈中附麗於血衛行脈外附麗於津惟血隨榮氣而行故榮氣傷則血瘀津隨衛氣而行故衛氣衰則津停治血以運化榮氣為主治津以溫通衛氣為主知乎此而榮血衛氣之説可以息矣且也血所以濡脈津所以濡筋傷寒汗後四肢拘急此津不濡筋之故而榮之行自手太陰始故靈經脈篇序十二經以手太陰為端衛之行自足太陽始故靈經筋篇序十二經以足太陽為端知乎此而心榮肺衛之説可以息矣衛出上焦據王素問注今靈樞上作下誤原易病之得於歲氣者一自正氣來一自時氣來正氣為病以傷寒傷暑為最著時氣為病以冬溫寒疫為最著皆以其極偏也正氣太一方之王氣本不病人而人自觸之謂之以人干天時氣對衝方之戾氣本能病人而人適中之謂之以天令人以人干天則觸之者病而不觸者無與焉以天令人則中之者固病而不中者即染之人氣處於獨天氣統於同所以正氣病無易時氣病有易也正氣雖過中而非厲時氣即稍弱而已毒所以正氣病縱如傷寒傷暑之重而不易時氣病縱非冬溫寒疫之重而亦易也今傷風咳嗽有相易者以此咳嗽亦自時氣來傷寒溫熱診治論所以謂傷寒熱病有別者別於診不別於症別於法不別於藥氣盛身寒得之傷寒氣虛身熱得之傷暑診之別也然而傷寒傳變則亦身熱傷暑發狂則亦氣盛非症之無別者乎淺人誤認職是故耳傷寒皆先汗後下溫熱或先下後汗法之別也然而汗則麻葛下則硝黃傷寒之汗下以是溫熱之汗下亦以是非藥之無別者乎由是推之傷寒雖因於寒一經化熱舍黃連石膏更用何藥以涼之溫熱雖已為熱倘或過治舍乾薑附子更用何藥以溫之人生之患縱有萬端本草之數止此一定藥可通用方何獨不可通用近之解傷寒論者執其中之白虎黃芩等湯以證此書之兼出溫熱治法彼將謂傷寒病始終不宜寒藥溫熱病始終不宜溫藥乎噫醫可若是之固哉論河間説傷寒之誤寒之為氣雖截然與熱對峙而其傷人也則隨人虛實而為病其人實則寒不能深入但著於皮膚而閉其腠理即不得不熱其人虛則寒無所隔礙遂過乎肌表而達於臟腑即不得不寒苟取素風論之旨繹之即知仲景方論寒熱雜見之故矣若素熱論人傷於寒則為病熱云云乃專主寒邪在經之常法以答篇首六七日之問不兼直中言與仲景為寒字盡致者義別河間泥此遂謂傷寒有熱無寒概指通脈理中等症為得之寒藥誤下非惟厚誣仲景並誤會內經也寒之乘也猛於他氣故例曰其傷於四時之氣皆能為病以傷寒為毒者以其最成殺厲之氣也河間乃謂溫熱涼寒皆取傷寒而分其微甚是以傷寒為四氣病統稱豈其然乎寒之藏也歷春至夏則陽氣大泄而不能復留故例止云寒毒藏於肌骨至春變為溫病至夏變為暑病河間乃續之曰秋變為濕病冬變為正傷寒如此任意增改其不足與語傷寒也明矣原瘴古者於隔蔽之義字止作障説文云障隔也是也其作墇作鄣者系通借字由是山之隔蔽者即易阜以山而作嶂其因山之隔蔽致少風多濕蒸而為氣足致民病者又易山以疒而作瘴觀於字孳之義而瘴之屬濕可知已瘴取隔義則與地氣發天不應之霧相似而與天氣發地不應之霧為對但患霧氣者千金自有症治與治瘴之度障散不同足徵近世混瘴於霧之非病源通瘴於疫余見東洋足本於青草黃芒瘴候較中國本多四百餘字所列瘴病證治獨詳第其稱嶺南之瘴猶如嶺北傷寒似戾乎他論當是指其盛行之勢相例耳故其病不隸於傷寒諸候而隸於癘疫要之濕疫乃疫中之一端未可以概疫也外臺又呼瘴為瘧要之濕瘧亦瘧中之一端未可以概瘧也聖濟總録論瘴與巢王異而診治加詳亦足補前人所未備大抵瘴之發也自有挾寒挾熱二者寒者白芷桂枝防風檳榔等已在度障散方中熱者犀羚見本經及綱目集簡方江南山多之地其瘴雖不比嶺南之甚然塗泥卑濕水氣適為瘴助往往於溫及暑病發時錯出其間故尤於犀羚宜也三吳老醫善使犀羚蓋自此始相治既久遂有混施之而失當者原痧詩疏謂江南有射工一名短弧含沙射人病源卷二十四分其種類為射工沙蝨溪毒三者其中人狀皆如傷寒有惡寒體熱四肢拘急頭痛骨悁屈伸張口欠呿等候本草綱目四十二溪毒射工毒沙蝨毒三者相近俱似傷寒故有挑沙刮沙之法其腹痛悶亂須臾殺人者謂之攪腸沙據引諸説則痧本作沙即指射工所含者言也其沙著人肉則或挑或刮以出之證治相符的有明徵後人踵用其法不能灼知是否為射工病但見惡寒發熱狀如傷寒者即用之於是治痧之法遂混入治暑中所以誤者以射工毒亦盛行於夏故爾夏月人氣自虛倘非沙毒而用刮挑則邪氣被卻不得出有因而增病者矣診者審之至沙加疒旁作痧而近醫遂云感觸痧穢乃天地間另一種氣此所謂不得其説從而為之辭也原胎胞宮血氣之生源有靈機故有化機不可有一物入留其中有之則血氣隨物而裹即令經閉腹大謂之胎也第其入留之物有內外之別由內入留者本氣所結故無所成由外入留者他氣所感故有所成二者皆於經行初淨得之有所成者必如其所感當經行後感男子之精即成為人感蟲蛇異物之精即成為蟲蛇異物至其生時皆有可驗此自外入留者二也其自內入留者四一為氣多怒之婦當其經行胞淨氣乘虛入則血與氣結令人經閉腹大方書謂之氣胎治之下其氣而消一為液多痰之婦當其經行胞淨痰乘虛入則血與痰結令人經閉腹大方書謂之痰胎治之下其痰而消一為水靈樞謂之石瘕與氣液二胎同法治之下其水而消一為血當經行時或因舉重或因犯房致經事不卒血瘀胞宮亦令人經閉腹大絶似真胎治之下其血而消以上四者系婦人本氣所結法與感異而與積聚同細考病源八瘕及魏之琇續案自知其故病源又有鬼胎云是精魅入藏所致然鬼交多在夢寐非真有施泄焉得似胎若精物意在吸取人精令人瘵死亦非有所施泄焉得似胎以今俗稱痰胎為鬼胎推之疑病源所云鬼者亦對人言之耳但須分別此五者方能各盡其法如概豫以統同之號即概施以安鎮之藥多不效也嗟乎醫學不明難免閨門不白之冤仁者可不究諸成注傷寒論論王叔和之次仲景論也有義有例各以類從無可議者成氏即用其本故與玉函經次同其六經六篇又與千金翼次同由晉而唐而宋即此本即此次也何自明以來諸家竟以顛倒移易為能哉夫成氏至八十歲始注此書則見聞廣閲歷深宜其辨別之精若此然於脈證方藥則當而於章節義例則疏如六經篇首不注明太陽陽明等之謂何與太陽諸症獨舉頭項強痛惡寒以為端陽明諸症獨舉胃家實以為端之義云何若平脈法寸口趺陽兩脈迭舉經意自有所指成則各分段隨文以注之使讀者茫然不知其何謂凡此皆成氏之疏欲窮經者尚須參考病源千金等書以自得之勿墨守一家也五志論人應乎天天有元陽元陽者升於春春時陽半在下陰半在上陽氣欲升而不能遽越當旺而不能自如則有雷霆以彰之人應之為事未遂其志拂拂然怒之象也春應肝故肝為怒怒生於恨成於憤恨而不已為怨為慍為恚憤而不已為奮為發為自強元陽者泄於夏夏時盛陽在上微陰在下陽氣盛滿於己而若自得輕易乎陰而不措意則有炎暑以彰之人應之為事已遂其志怡怡然喜之象也夏應心故心為喜喜生於盛成於玩盛而不已為舒緩為惰為安玩而不已為狎侮為愎為自足元陽者平於中央此時陰陽和勻既籌及於陽之勝又預計夫陽之敗則反覆以存其變焉人應之為思患而預防又土為萬物所歸和者偏者皆歸之春氣溫而極於季春夏氣熱而極於季夏秋氣涼而極於季秋冬氣寒而極於季冬靜觀以持其常焉人應之為閲歷多而是非熟二者思之象也中央應脾故脾為思思生於先成於後先事而思為慎為戒為畏為自虛後事而思為樂為慕為智為自矜二者皆思之所為如是則勞矣故脾主勞元陽者收於秋秋時陽半在上陰半在下陽氣就衰而日受陰之剝已退而日視陰之長則有悽切之氣以彰之人應之為事將敗其志殷殷然憂之象也秋應肺故肺為憂憂生於慮成於悔慮而不已為拘為愁為不安悔而不已為悲哀為哭為自咎元陽者藏於冬冬時微陽在下盛陰在上陽氣避陰之方張而不出防陰之滅己而自懼於是乎水冰地坼寒風冽凜而陽氣惟不樹聲色以避之人應之為事已敗其志惕惕然恐之象也冬應腎故腎為恐恐生於暇成於怯暇而不已為退為優遊為呻吟怯而不已為愧為伏為自餒陰陽交併論陰陽交併二者乃熱病表裡俱實者之診法也其表裡俱實而復相連互曰交續自分清曰並陰交者裡實較盛故已得汗而脈尚躁盛並陽則初似陰交而復得汗脈漸靜以里散表解也陽交者表實較盛故脈常躁盛而不得汗並陰則初似陽交而一得汗散熱即泄以表解里微也故交者皆死並者皆生脈經曰熱病已得汗而脈尚躁盛此陰脈之極也死其得汗而脈靜者生也得上當有復字脈經熱病煩已而汗脈當靜太陽病脈反躁盛者是陰陽交死復得汗脈靜者生又曰熱病已得汗脈尚躁盛大熱汗之雖不汗出若衄是謂並陽故活皆言復汗也此合陰交與並陽言之又曰熱病脈常各本常作尚涉上而誤躁盛而不得汗者此陽脈之極也死脈躁盛得汗出者生也此合陽交與並陰言之陰極陽極即裡實盛表實盛之謂大抵表裡俱實之症不交則並不並則交死生之關捷於反掌史記倉公傳脈法曰熱病陰陽交者死切之不交並陰並陰者脈順清而愈其熱雖未盡猶活也繹倉公不交並陰四字則知其轉易間難逆料矣診交之法又有進退諸證在脈經中此皆診決死生之要切宜究之復得汗以症言非以治言故有下之而始得汗者素問所言實止是陰交於陽交無涉統稱陰陽交者猶男子陰易女之陽易統稱陰陽易也蟲論三尸九蟲與人俱生無所假也外此必有所假而生如癥瘕門之鱉症蛇瘕雞雛及諸瘻門之蜣螂蚍蜉螻蟻等名皆因飲食而假外之蟲氣以生其結於腸胃之募原為癥瘕散於經絡為瘻也至若五臟之勞有五臟之蟲五色之風有五色之蟲則並不假於外之蟲氣以生若曰人身血肉可化異類毋乃誕乎此必假內之蟲氣以生也內之蟲氣三尸九蟲是也大抵邪入而與三尸九蟲相感則孕而生蟲猶之六淫之感人本以人五臟所稟五行氣應之也夫何足怪病源卷二十三去尸蟲常接引外邪為人患害又陰尸者初著之狀起於皮膚內卒有物狀如蛤蟆經宿與身內尸蟲相搏如杯大動搖掣痛不可忍者多因天雨得之此外邪與尸蟲相感之證風勞生蟲亦猶是也知此始可與論尸注疳蒸諸大症若僅執熱極風生之説猶知其當然不知其所以然也又況以隋唐言蟲諸論為不經而棄之哉溫疫總論寒與熱為定名溫與疫為虛位傷寒例雖以溫兼正氣疫貼時氣其實溫者蘊也疫者役也苟有蘊蓄在內而其病如相役使者不論寒熱皆得稱為溫疫例據時稱以示別不必泥看能知此義而後百家之言溫疫者可一一以意逆之也夫溫與疫既為虛位則其為病不一但因於寒暑而又有四時不正之氣挾之則為天行溫疫屬傷寒若因於寒暑而又有山川林谷及天地霧霧之氣抑之則為瘴疫溫瘴亦通稱為溫疫因於寒暑而又有鬼神之氣乘之則為癘疫亦稱溫疫屬雜病苦因於寒暑而又有飲食之氣間之則發為雜病如霍亂瘧疸之類皆不稱為溫疫屬雜病條分縷析而後溫疫諸雜出之論不至目炫此溫疫數者中惟鬼神一因與因於寒暑者言多相混近世不能分別須細參病源卷十癘疫瘴氣兩候及千金卷九闢溫篇自明病源癘瘴不與溫病同篇而另列為一卷千金以兩溫分居二篇首尾豈無意哉而鬼神之不兼溫疫者自屬中惡與傷寒法無涉猶瘴不兼溫疫但為之瘴飲食不兼溫疫但謂之傷飲食而已瘧論葉案治瘧不用柴胡徐評非之解之者曰治傷寒少陽正瘧用柴胡治秋間寒熱類瘧不用柴胡泉應之曰否不然素瘧論以夏傷於暑為端而余瘧附焉是秋間寒熱之為正瘧經有明文病源千金皆本經説外臺既列病源之論而所集方不下千首鮮用柴胡者可見謂秋間之寒熱不用柴胡則是而指為類瘧則非仲景於少陽篇明言往來寒熱形如瘧狀如瘧二字正類瘧之謂少陽症之為類瘧出於仲景親口今反指為正瘧何耶但諸醫猶止誤於論症徐氏則並論治亦誤何以言之傷寒邪從表入其里無根以柴胡提之則出夏秋之病新涼在外而蘊暑在中其里有根若以柴胡提之則外邪雖解而內熱即升橫流沖決不可復製往往有耳聾目赤譫語神昏汗漏體枯延成不治者不得不以徐説為淫辭之助也噫亦究古訓而已矣尸疰疳蒸四大症論五尸五疰五疳五蒸雜病中之四大症也仲景傷寒始言蒸蒸金匱狐惑實開疳症而走馬湯治飛尸獺肝散治冷疰已略具大綱矣至巢源肘後千金外臺諸書始暢厥論以為內科專家最重之任也近世書中鮮有之非近世無此四症也醫者遇尸疰詭以肝氣目之遇疳蒸詭以勞病目之相沿既久遂不措意因不列名耳然尸疰二字涉於不祥疳蒸二字僅見兒科今若稱此以告諸病家及加諸年壯不幾駭人聽聞乎古名誠難復也但須於肝氣一門知有尸疰二症混其中於勞病一門知有疳蒸二症混其中隱其名而存其實則臨症瞭然矣至古人治此四症之效方亦欲為大醫者所不可不備也虛勞論今之所謂虛勞古之所謂蒸也古之所謂虛勞今之所謂脫力也金匱必列虛勞者以見傷寒自有因脫力得者也俗稱脫力傷寒本此知此而金匱虛勞諸方能用之矣俗稱脫力不專指疲勞言凡五勞皆在其中脫力有成痼疾者有在一時者有著一處者苟因勞傷氣血不復皆得稱為虛勞人但泥於弱症損症之不起者為虛勞而不知彼特其一端也若一時一處之虛勞則或待治而後愈或不治而自愈無甚足異第既有虛勞之因風寒隨而入之金匱本為風寒盡其變故渾言之曰虛勞不復分別其為何勞推而準之傷寒勞復乃虛勞之在一時者亦不分別其若者為操作之勞若者為房室之勞也依義本當列此篇末編傷寒論者欲其便覽移置如此耳他如脈經云病人一臂不隨時復轉移在一臂者此為微勞營衛氣不周故也久久自愈乃虛勞之著一處者亦不分別有為何勞亦以有本病可列故也此經又有勞瘧千金外臺有勞嗽勞聾凡在一時及著一處者皆仿此讀古人書須辨其名以究其指醫亦如之誠能知此何至以建中湯等方誤投之蒸病也哉傳尸勞論外臺始有傳尸勞之名歷宋至今皆著於録嘗欲問其為何病則諸老醫無能言之者及泉習之有年乃知傳尸勞者合尸疰疳蒸四大症以名之也初以體虛受邪入感尸蟲於是沉沉默默無處不惡而不能的言所苦此時名之為尸可也甚而發熱喘促顴赤名之為蒸可也及其項間生塊唇口喉舌皆瘡名之為疳可也至差而復劇死而傳人則為注矣備此四症故方法不一各據見在為言也古人殗殜無辜伏連尸注等稱亦各據一端為言也余幼時胞姑有病此死者及長而嫡妹又病此死然皆不傳染殆相似而未的者歟要之已備尸疳蒸三大症矣遇是症者倘能分別論治其於古方清熱調胃殺蟲諸法庶不貽誤特未必其果愈耳肺萎論肺萎肺之大葉不舉也其外症以咳而唾白沫者為真病源或兼欲咳不能咳及嘔逆小便言之成無己注傷寒論則以咽喉不利唾膿血為肺萎皆非的候惟外臺引許仁則云肺萎之狀唾白如雪細沫稠黏此八字深得仲景言外之意最為的當若巢成所説乃其兼症或有或無未可必也肺萎病當屬六極氣極之一也多在久嗽之後骨蒸之餘其甚者白沫中帶血且或帶膿焉故金匱云咳唾膿血脈數虛者為肺萎數實者為肺癰仲景以脈之異辨其症之同亦可知膿血不獨肺癰有之詳余所撰證原中正水風水診法論目裹腫頸脈動時咳諸症正水與風水同但有此諸症而按其腫上隨手起者正水不起者風水以此為別且必股冷腹大乃為正水已成則正水重於風水也靈水脹水始起也目裹上微腫如新臥起之狀其頸脈動時咳陰股間寒足脛腫腹乃大其水已成矣以手按其腫俗本腫作腹今從病源引隨手而起如裹水之狀金匱水氣視人之目裹上微腫如新臥起狀其頸脈動時咳按其手足上陷而不起者風水文義甚明病源於水腫全據靈樞於風水全據金匱分別當已惟風水久久變成水病則亦按之隨起故肘後方曰水病之初先兩目上腫起如老蠶色俠頸脈動股里冷脛中滿按之沒指腹內轉側有聲此其候也不即療須臾身體稍腫腹盡脹按之隨手起則病已成非與經違也葛意以風水為正水之初起而渾言之曰水者亦以有股里冷一症耳實與諸經相成也女勞疸黑疸同治論千金及外臺引金匱黃疸篇文皆以硝礬散症為女勞疸而近效云女勞疸療與黑疸同病源則曰女勞疸之狀身目皆黃發熱惡寒小腹滿急小便難因大勞大熱而交接竟即入水所致也黑疸之狀小腹滿身體盡黃額上反黑足下熱大便黑是也夫黃疸酒疸女勞疸久久變成黑疸據疸説則金匱硝礬散症經文當斷自膀胱急以下十六字屬黑疸獨日晡發熱惡寒為女勞疸的候余則女勞疸久久變為黑疸之候也如此疏解則於經文得之二字及因作二字語氣極合巢氏真善會仲景意者其硝礬散本是治黑疸之方以黑疸與女勞疸同治故金匱不別言之近效之説信而有徵詳余所撰金匱方論注中吐血衄血便血溺血嘔吐汗出下利消利八症異形同診論亡血之大症四吐衄便溺是也亡津之大症四嘔利消汗是也吐血出於賁門與嘔吐同衄血名為紅汗與汗出同便血出於魄門與下利同溺血出於胞與消利同八症以四屬之殊途而同歸為亡津亡血最大者也靈樞經云奪血者無汗奪汗者無血是津血同類又手陽明主津足陽明主血是津血又同經津血之為物既同故八症之為診從同八症之由熱得之者並以見陰脈及陰症為欲已見陽脈及陽症為未解其由寒得之者並以見陽脈及陽症為向愈見陰脈及陰症為將脫俱詳靈素脈經等書不贅引凡辨症有當分而觀之者如痰飲篇是也有當合而觀之者如此篇是也思慮致遺論心藏神脾藏智與意腎藏精與志人之思慮智意主之智意之運用神主之故或曰思慮傷心或曰思慮傷脾者舉一言之也究之思慮之始構也則因心以令脾及思慮之既竭也則因脾以纍心是傷脾重於傷心矣大抵五志所傷每以過極而氣並思慮之過氣並於脾故經曰思則氣結並乃結也五行土剋水水主冬為閉藏脾實則有火火性發泄以過極之實乘受克之虛以發泄之性變閉藏之常而復以脾病纍心之故處以無主之神於是乎恍惚離散而精以泄經云有餘則夢豫脾以氣並而見為有餘故夢以精豫人也論是症者自當以脾火上蒙心神下克腎水為正或概執諸熱屬心之説以相列見其與五行生剋之理不合遂據易水火既濟未濟二卦證成心腎不交之論豈知易象止取貞悔為義並非實事若移此以論病則大蓄天在山中大壯雷行天上亦將信為事之所有而以肺入脾中心行肺上者擬其病象何如乎夫立論當取其推而皆準者病無純虛論以人之虛因天之虛為賊邪病自春分至秋分之寒自秋分至春分之熱是也以人之虛因天之實為正邪病自春分至秋分之熱自秋分至春分之寒是也總言之則寒熱二者以應二氣析言之則寒熱涼溫四者以應四時而皆生於風故內經曰風者百病之長也風之溫者必挾濕其涼者但為風與寒熱分主四時靈九宮所謂春濕夏熱秋風冬寒是也然濕與寒熱惟當其旺時則有之而風乃四時皆有故風之病人獨多人以勞役解脫喜怒陰陽飲食醉飽人鬼驚恐跌打墮壓蟲獸咬傷而致虛有一於此則風即湊之其在濕與寒熱之令及有賊邪時者亦各湊之故曰邪之所湊其氣必虛第既湊之後反見為實其為狀也有相半者有相過者無純虛也惟大病被汗吐下後邪去而氣血不能遽復及婦人新産後而液去而形氣不足以充則純虛然一在病後一則非病不可以治病之法治之夫病無純虛則方無蠻補無足怪者或難之曰老年聾盲非純虛乎答曰此亦風也老年血氣當衰藥不能托且托之而後者乘虛續至故永不愈耳其不愈者在虛其為病者仍屬風用藥論一藥性有剛柔剛為陽柔為陰故剛藥動柔藥靜剛而動者其行急急則迅發而無餘其起疾也速其殺人也亦暴柔而靜者其行緩緩則潛滋而相續其起疾也遲其殺人也亦舒無識者好為一偏其害不可勝言而中立者因有牽掣之説焉豈知柔者自遲不能強之使速剛者自速不能強之使遲遲速並使遲者必讓速者以先行下咽之後但見陽藥之行陽不見陰藥之行陰若病宜於陽則陰藥初不見功而反釀禍於陽藥已過之後若病宜於陰則陰藥未及奏效而已顯受夫陽藥反掌之災是以史立者亦謬也總之對病發藥斯為行所無事用藥論二凡藥能逐邪者皆能傷正能補虛者皆能留邪能提邪出某經者皆能引邪入於某經故麻桂發表亦能亡陽苓瀉利水亦能爍津於此知無藥之不偏矣惟性各有偏故能去一偏之病若造物生藥概豫以和平之性何以去病乎夫亦在馭之而已馭之能否全在醫者識症有定見俾逐邪者辨其正之虛不虛而邪去正自復補虛者知其邪之盡不盡而正勝邪難乾斟酌輕重之間分別後先之次神明於隨症用藥四字方法之能事畢矣何必朋參耆而仇硝黃哉湯液論湯液亦飲也素經脈別飲入於胃遊溢精氣上輸於脾脾氣散精上歸於肺肺朝百脈行精於皮毛毛脈合精通調水道下輸膀胱水精四布五精並行其言飲入胃後上下先後分布之序即藥入胃後與病相當之理以其先布於上故遇輕清之藥則先發而與上病相當但先發者先罷至水精四布而後輕清者已無力矣其不能治下而亦不足礙下者勢也重濁之藥其發既遲當其輸脾歸肺之時尚未盡發必至水精四布而後藥力始畢達而與下病相當此輕清治上重濁治下所由分也經曰近而奇偶制小其服也遠而奇偶制大其服也皆取藥發遲速部位高下為義其入臟者亦止云五味入胃各歸其所喜攻如酸先入肝云云不必不入他臟也後人不知古人制方之意遂謂某藥入某經某藥兼入某經則試問胃氣被藥氣使乎抑藥氣被胃氣使乎夫固不辨而明也乃或誤宗其説如桂枝湯方見其主治太陽病多因以桂枝為足太陽經藥殊不思太陰病亦用桂枝而真武理中四逆皆有加桂之例籲可怪也總之湯液治病分氣味不分經絡與針法大異製藥論自雷斆著炮製之論而後世之以藥製藥者愈出而愈奇但因此而失其本性者亦不少藥之有利必有弊勢也病之資利不資弊情也用之去弊勿去利理也古方能使各遂其性如仲景小半夏湯類凡生薑半夏並用者皆一時同入之非先時專制之正欲生半夏之得盡其長而復借生薑以隨救其短譬諸用人自有使貪使詐之權衡不必胥天下之菲材而盡桎梏之使不得動也各遂之妙如此若後世專制之法在臨時修合丸散而即服者猶可倘預製備售則被制者之力已微甚而至再至三至十餘制則取其質而汩其性其能去病也幾何近見人治痰瘧於肆中求半貝丸服之無效取生半夏貝母為末和薑汁服之即效但微有煩狀耳於此可類推已或薄古法為疏盍思之藥驗論凡中病之藥服後半日許可驗其當否者大法有三一則藥到病除如靈樞不得臥用半夏秫米覆杯即臥及他方所云一劑知二劑已者是也一則服藥後別生他病非藥之祟正是病被藥攻拒之使然如傷寒論太陰病服桂枝湯反煩風濕相搏服朮附湯其人如冒狀者是也一則服藥後所病反劇非藥之誤正是以藥攻病托之使然如證類本草成訥進豨蘞丸方表云臣弟訴患中風五年服此丸至二千丸所患愈加不得憂慮服至四千丸必得復至五千丸當復丁壯是也第一驗人所易知其第二驗恆易令人疑惑自非識病辨脈確有把握必將改易方法以致轉輾貽誤者有之若第三驗則必訾之議之因而棄之矣然數十年目見耳聞第三驗最多如傷寒初起及瘧痢方盛之時投以中病之藥往往增劇第二驗次之第一驗最少世人狃於第一驗之快而欲以概其餘噫此事真難言哉古方用法論古者每方各有主藥用其主而進退其餘可云從古某方加減如用其餘而去其主即不得稱某方矣仲景理中湯一名治中湯蓋取別録人參調中兩字是人參乃其主藥也桃花湯取赤石脂一名桃花石為義是赤石脂乃其主藥也若去人參赤石脂用其朮乾等而稱理中桃花則失其義而襲其名陋乎不陋非獨經方為然也雖後世亦有之丹溪治六郁越鞠丸方以川芎山梔為主緣川芎即左傳鞠窮山梔本草一名越桃故各摘取一字以名之以見能治郁者之全在乎此若不用芎梔用餘四味尚能再稱越鞠乎本草經用之藥僅四五百種而自漢至明方以億萬計隨舉數味以成方皆當有合於古舉其相似者反遺其相同者矣昔徐靈胎誚葉天士用局方逍遙散而去柴胡非以此哉學者可以類推瀉心湯類諸方總論諸瀉心皆從小柴胡來小柴胡以柴薑治半表芩參甘半治半里茲則去其治半表者參用陷胸法而隨建主藥故當分數類觀之半夏瀉心湯即小柴胡去柴薑之治表加乾薑黃連以和胃也其生薑瀉心湯與甘草瀉心湯皆即半夏瀉心湯原方而主藥略增從金匱有人參三方不外乾薑黃連者以此祛心下痞乃胃虛上逆所致與表陷之痞不同故重在和胃也其主藥皆在小柴胡中自為一類其乾薑黃連黃芩人參湯則截半夏瀉心之半而為之其黃連湯又即半夏瀉心去黃芩加桂枝者但二方皆重用黃連使與乾薑並視半夏瀉心為小變也黃芩湯即截小柴胡之半而加芍藥以治腹痛其黃芩加半夏生薑湯即小柴胡去柴參加芍藥也二方皆主小柴胡中之黃芩自為一類旋覆代赭湯即小柴胡去柴芩加旋代增薑減參者故以旋代命名厚朴生薑甘草半夏人參湯即小柴胡去柴芩加朴增薑減參者二方皆主小柴胡中之生薑自為一類其橘皮竹茹湯即厚朴生薑甘草半夏人參湯去朴半加橘皮竹茹大棗增甘草故以橘皮竹茹命史其橘皮湯即取其方中二味為之二方自為一類小半夏湯乃抽小柴胡方中治嘔之品而倍其分者其生薑半夏湯即半夏之法而小半夏加茯苓湯屬焉其半夏乾薑散即生薑半夏湯去生薑加乾薑者意固重在溫胃與生薑溫經略殊而大半夏湯即半夏乾薑散之變焉者也其乾薑人參半夏丸即半夏乾薑散加人參倍半夏者六方皆從小半夏湯來主小柴胡中之半夏自為一類瀉心湯自大小陷胸來大黃黃連瀉心湯即瀉心湯原方去黃芩附子瀉心湯即瀉心湯原方加附子三方不外大黃黃連者以此處心下痞乃表邪內陷所致與結胸之義相同而與半夏等三方痞症不同故重在下實乃由瀉心而將入承氣也承氣湯類諸方總論胃實則不調承氣意在調胃故或以調胃二字冠之大黃下一切積芒硝軟一切堅考之本草皆屬蕩滌腸胃之品故仲景合二味以治胃實而一切病胃實者準此其用甘草不過和硝黃之味而已不必泥和中益氣謂為調胃二字命名之所在也此本籠統之方用之者隨症加減往往師其意而易其名故見腹滿則加朴枳去甘草為大承氣見腹滿不結者則加朴枳去甘草為小承氣有瘀血則加桃桂為桃核承氣見水結則加甘遂去草為大陷胸見吐食則去硝為大黃甘草湯一方生五方有條不紊若夫從大承氣來者則去硝為厚朴三物湯三物合桂枝去芍藥則為厚朴七物湯皆主厚朴也其從小承氣來者則差其分為厚朴大黃湯差其分而加芍藥二仁為麻仁丸皆主大黃也其從桃核承氣來者則大黃蟅蟲丸桂枝茯苓丸抵當湯及丸皆主桃核也其從大陷胸來者則大陷胸丸十棗湯甘遂半夏湯皆主甘遂也而己椒藶黃丸又從大陷胸丸來以同用葶藶也其大黃硝石湯備急丸大黃附子湯即承氣之隨症加減法也而小陷胸湯白散則又因所治之部位略高而師承氣之意以變焉者也小陷胸主心下結痛與心下痞相近故又生出瀉心一派來小陷胸主胸有黃涎與胸痹之頑唾相近故又生出栝蔞薤白一派來要之白散之下以巴豆小陷胸之下以栝蔞其栝蔞薤白湯栝蔞薤白加半夏湯枳實薤白桂枝湯三方皆從小陷胸來古方權量有定論論從來考古方權量者人各言殊大半誤以漢制當之耳豈知經方傳於仲景而不自仲景始外臺卷一謂桂枝湯為歧伯授黃帝之方而分兩與傷寒論悉同可見經方傳自上古所用權量亦上古制非漢制也千金備詳神農稱及古藥升之制蓋古醫權用神農量用藥升於一代常用權量外自成一例仲景而下訖於外臺所集漢晉宋齊諸方皆然逮隋唐人兼用大兩大升而後世制方遂有隨代為輕重者此古權量所由湮也國朝吳王繩林所考宗法千金參以考訂定為古一兩當今七分六釐古一升當今六勺七抄洵不刊之論無間然矣其書載在吳醫匯講中
